# Kernel instances: the shapes one rank sees.
#
# Every device kernel the stack builds from a source whose body fixes model geometry is listed
# here, one [instance] table per entry symbol. A build reads this file and passes each instance's
# values to the compiler as SPARK_INSTANCE_<ENTRY>_<ARG> macros; a source that needs a shape has
# no default and fails to compile without it. The same file is the input the catalogue's shape
# rules are generated from (crates/sparkflash-ops/build.rs), so a shape cannot be claimed here
# without being built, or built without being claimable.
#
# Fields:
#   source       the .cu source under kernels/
#   entry        the extern "C" __global__ symbol the instance builds
#   cubin        the cubin the instance is linked into (default: the source stem). Instances that
#                share a cubin are compiled in one translation unit, so the released multi-symbol
#                cubins keep their file names and symbol sets.
#   family       the shape vocabulary: "router" needs hidden/experts/top_k, "routed" needs those
#                plus intermediate/padded, "seams" needs hidden and optionally hc (the residual
#                stream count; the runtime-width seam entries omit it), "drafter" needs
#                hidden/hc/taps/latent/window/markov_rank, "woa" needs
#                heads/head_dim/o_groups/o_lora_rank, "rows" needs
#                hidden/intermediate/experts/top_k, "head" needs hidden/vocab_per_rank/ranks,
#                "vision" needs hidden/heads/patch/intermediate/out_hidden/experts/top_k,
#                "mla" needs the CSA2 latent/index/window geometry, and "select" the indexer's
#                head shape and position bound.
#   format       the stored format the entry decodes, as one token: bf16, f32, fp8 (an inverse
#                scale a 128 x 128 tile), mx-fp8 (one power-of-two scale a 32-value block),
#                mx-fp8-tiled (the same arithmetic in the 32 x 32 B12x tiling a dense body
#                reads), mx-fp8-row (one power-of-two scale a row, every 32 columns), nvfp4 or
#                mx-fp4. sparkflash-ops carries it into the catalogue's format key and checks it
#                against what the source reads; a format the build did not state cannot be
#                claimed by any entry. It is required: a body whose arithmetic does not depend
#                on a weight's stored format still states the values it reads (bf16 or f32).
#   catalogue    optional catalogue key; sparkflash-ops generates that part's exact shape rule
#                from every instance carrying the same key.
#   catalogue_intermediate
#                optional; false keeps the key's generated rule from claiming an intermediate
#                width (the MTP part has no such geometry even though its expert bodies take one).
#   catalogue_hidden
#                optional; false keeps the key's generated rule open on hidden, for a body whose
#                width is a runtime launch word (the seam quantisers) rather than a compiled shape.
#   catalogue_dims
#                optional; the subset of hidden/intermediate/experts/top_k the generated rule
#                constrains, when the source fixes only some of them. Every instance of the key
#                must name the same subset.
#   intermediate_multiple / max_top_k
#                optional runtime bounds the source states; they are emitted instead of an equality.
#   hidden, experts, top_k, intermediate, padded, hc, taps, latent, window, markov_rank,
#   vocab_per_rank, ranks, heads, patch, out_hidden, head_dim, kv_lora, index_heads,
#   index_head_dim, index_topk, hsi_blocks, hsi_block_tokens, ring_capacity, positions
#                the values one rank sees, as positive integers. They are passed to the compiler
#                with the source's own suffix (u), not reinterpreted.
#
# A second shape is a line here and a rebuild. The proof instance at the bottom is deliberately
# not in any released cubin: it exists to show a different width/expert count/top-k compiles
# from the same body, and it is built into its own cubin so the released cubin's bytes stay pinned.

version = 1

