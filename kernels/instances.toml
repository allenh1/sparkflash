# --- The certified head ----------------------------------------------------------------------
# The certified screen and its device reduction are compiled for the released hidden width and
# this rank's vocabulary shard. The reduction folds four shards, so the total vocabulary is
# ranks * vocab_per_rank = 129,280. Both entries of a source share the source's released cubin.
[[instance]]
source = "cert_lm_head_sm121.cu"
entry = "cert_lm_head_sm121"
cubin = "cert_lm_head_sm121"
family = "head"
catalogue = "deepseek-head"
hidden = 5120
vocab_per_rank = 32320
ranks = 4

