# --- The vision tower ------------------------------------------------------------------------
# The DeepSeek-V4.1-Flash vision tower (DECISIONS.md D59/D84/D85) is 1024 wide with 16 query
# heads of 64, a 2816-wide SwiGLU, a 3x3 unfold and a 5120-wide aligner; rank 3 runs all of it.
# The released image is kernels/opt_vision_sm121.cu, whose ten entries load by name from
# opt_vision_sm121.cubin. The patchify body is compiled at both patch sides it exports: 14 for
