# --- The second-shape build proof -------------------------------------------------------------
# Not loaded by any arm and not in the baseline: a 4096-wide router with 256 experts and top-8.
# It compiles from opt_router_sm121.cu alone, into its own cubin, so the released cubin's symbol
# set and bytes are untouched. scripts/build-cubins.sh builds it and
# crates/sparkflash-kernels/tests/kernel_instances.rs checks it takes the body's own bounds.
[[instance]]
source = "opt_router_sm121.cu"
entry = "opt_router_4096e256k8_sm121"
cubin = "opt_router_4096e256k8_sm121"
family = "router"
hidden = 4096
experts = 256
top_k = 8

# The head's second shape: the same bodies at a 4096-wide hidden state and a 16,384-entry rank
# shard (65,536 total vocabulary over four ranks). It compiles from cert_lm_head_sm121.cu alone
