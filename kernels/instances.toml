# Kernel instances: the shapes one rank sees.
#
# Every device kernel the stack builds from a source whose body fixes model geometry is listed
# here, one [instance] table per entry symbol. A build reads this file and passes each instance's
# values to the compiler as SPARK_INSTANCE_<ENTRY>_<ARG> macros; a source that needs a shape has
# no default and fails to compile without it. The same file is the input the catalogue's shape
# rules are generated from (crates/sparkflash-ops/build.rs), so a shape cannot be claimed here
# without being built, or built without being claimable.
#
# Fields:
#   source       the .cu source under kernels/
#   entry        the extern "C" __global__ symbol the instance builds
#   cubin        the cubin the instance is linked into (default: the source stem). Instances that
#                share a cubin are compiled in one translation unit, so the released multi-symbol
#                cubins keep their file names and symbol sets.
#   family       the shape vocabulary: "router" needs hidden/experts/top_k, "routed" needs those
#                plus intermediate/padded, "mla" the MLA latent and indexer geometry, "select"
#                the indexer head shape and the compiled position bound.
#   catalogue    optional catalogue key; sparkflash-ops generates that part's exact shape rule
#                from every instance carrying the same key.
#   catalogue_intermediate
#                optional; false keeps the key's generated rule from claiming an intermediate
#                width (the MTP part has no such geometry even though its expert bodies take one).
#   hidden, experts, top_k, intermediate, padded
#                the values one rank sees, as positive integers. They are passed to the compiler
#                with the source's own suffix (u), not reinterpreted.
#
# A second shape is a line here and a rebuild. The proof instance at the bottom is deliberately
# not in any released cubin: it exists to show a different width/expert count/top-k compiles
# from the same body, and it is built into its own cubin so the released cubin's bytes stay pinned.

version = 1

# --- The routers -----------------------------------------------------------------------------
# opt_router is the one-launch router. Its two released shapes are the backbone's 384 experts
# top-6 and the DSpark stages' 128 experts top-3; both live in opt_router_sm121.cubin.
[[instance]]
source = "opt_router_sm121.cu"
entry = "opt_router_sm121"
cubin = "opt_router_sm121"
family = "router"
catalogue = "deepseek-router"
hidden = 5120
experts = 384
top_k = 6

