# The drafter's second-shape proof: a 4096-wide stream with two copies and two taps. It is
# never in a released cubin and nothing loads it; it exists so a different shape compiles from the
# same body. The latent, window and Markov rank are different as well (256, 64, 128), though the
# tap body does not read them; the instance still names every family key.
[[instance]]
source = "opt_draft_sm121.cu"
entry = "opt_draft_taps_4096h2c2t_sm121"
cubin = "opt_draft_taps_4096h2c2t_sm121"
family = "drafter"
hidden = 4096
hc = 2
taps = 2
latent = 256
window = 64
markov_rank = 128

# --- The second-shape build proof -------------------------------------------------------------
# Not loaded by any arm and not in the baseline: a 4096-wide router with 256 experts and top-8.
# It compiles from opt_router_sm121.cu alone, into its own cubin, so the released cubin's symbol
# set and bytes are untouched. scripts/build-cubins.sh builds it and
# crates/sparkflash-kernels/tests/kernel_instances.rs checks it takes the body's own bounds.
[[instance]]
source = "opt_router_sm121.cu"
entry = "opt_router_4096e256k8_sm121"
cubin = "opt_router_4096e256k8_sm121"
family = "router"
hidden = 4096
experts = 256
top_k = 8