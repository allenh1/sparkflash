[package]
name = "sparkflash-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed, allocation-free operation plans over SparkFlash's one sm_121a kernel stack"

[dependencies]
sparkflash-kernels = { workspace = true }
sparkflash-model = { workspace = true }
sparkflash-weights = { workspace = true }
half = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
# build.rs reads kernels/instances.toml and generates the catalogue's shape rules for the kernel
# families that take model shapes as instance arguments. The file is the one list both the build
# and the catalogue read, so a claim cannot name a shape that was not built.
toml = { workspace = true }

[features]
# The direct-RDMA exchange as every TP group's device leg (src/doorbell.rs), over
# sparkflash_kernels::write_exchange and sparkflash-comm's verbs backend.
rdma = ["sparkflash-kernels/rdma"]

[dev-dependencies]
sparkflash-model-deepseek-v41 = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
