[package]
name = "sparkflash-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "sm_121a CUDA kernels, CPU reference implementations and the shared dlopen CUDA driver wrapper"

[dependencies]
sparkflash-trace = { workspace = true }
# The shared CUDA harness (src/cuda_harness.rs) builds the engine-format window row with the
# engine's released quantiser, so the engine crate is a library dependency and not only an
# example dev-dependency: the m7 and m8 harnesses must import one row construction and the
# helper's quantiser is the engine's own. The edge is acyclic - the engine crate depends on no
# other workspace crate.
sparkflash-engine = { path = "../sparkflash-engine" }
half = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
cudarc = { workspace = true, optional = true }
# The shared CUDA driver (src/cuda_driver.rs) resolves the driver API with dlopen at run time, so
# nothing links libcuda and a CPU-only build is unaffected. Same crate and version family cudarc
# itself uses for fallback-dynamic-loading, so this adds an edge and not a new package version.
libloading = "0.8"

[features]
default = []
# "cuda" selects the optional cudarc dependency and nothing else. It does NOT gate the kernel
# builds: build.rs always probes the toolchain and emits the sparkflash_cuda_toolkit cfg that the
# compile-time ABI checks read, so the kernels are parsed whether or not this feature is on. No
# module in this crate calls cudarc yet, so today it adds a dependency and no code path. The
# runtime device/launch path the harness examples use is src/cuda_driver.rs, which is
# feature-independent and dlopen-only, so a CPU-only build still has it available. Enabling cuda
# does not currently build: the workspace pins cudarc without one of its required cuda-12xxx/13xxx
# version features, so cudarc's own build.rs stops with "Must specify one of the following
# features: ...". Making it build means choosing a version feature (cuda-12090 matches the 12.9
# toolkit this repo probes with) in the root Cargo.toml, which is outside this crate.
cuda = ["dep:cudarc"]

[dev-dependencies]
# The engine crate is a normal dependency now (src/cuda_harness.rs calls its released
# quantiser); examples/m7_layer0/main.rs --stage 9 also uses its released Engram seam: the hash
# layout and the paged table read are engine code, and duplicating them in the kernels crate
# would put a second copy of the released arithmetic next to the one the host pair was produced
# with. sha2 hashes the two determinism blobs; the harness does not otherwise hash anything.
# Neither edge creates a cycle: the engine crate depends on no other workspace crate.
sha2 = { workspace = true }
# The task-14 union-attention example reads the engine-produced attention-case fixture (JSON) and
# writes its run report as JSON; the fixture is data, not a new crate edge beyond these two.
serde = { workspace = true }
# The 2B harness (examples/m8_sequence.rs) consumes the task-7 device KV store, so it needs the
# kv crate with its CUDA backend. This is a dev-only edge: the regular graph is
# kernels -> engine -> kv, and kv depends on no kernel crate, so the edge is acyclic and a
# CPU-only build of the library is unaffected. The feature pulls libloading into the dev build,
# the same dlopen-only driver family cuda_driver already uses.
sparkflash-kv = { workspace = true, features = ["cuda"] }
# The device run reads the node golden fixture (SequenceFixture derives Deserialize) and writes
# its own JSON report; the library itself does not depend on a JSON writer.
serde_json = { workspace = true }
# The vision tower's golden check (examples/vision_golden.rs) builds the canvas with the image
# front end the server uses, so the patches it checks are the served ones. Dev-only: the library
# takes a canvas and never decodes an image.
sparkflash-vision = { workspace = true }
