[package]
name = "sparkflash-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "sm_121a CUDA kernels and CPU reference implementations"

[dependencies]
sparkflash-trace = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
cudarc = { workspace = true, optional = true }
# Used only by examples/moe_slice.rs, the device-path vertical slice: the CUDA driver API is
# resolved with dlopen at run time, so nothing links libcuda. Same crate and version family cudarc
# itself uses for fallback-dynamic-loading, so this adds an edge and not a new package version.
libloading = "0.8"

[features]
default = []
# "cuda" selects the optional cudarc dependency and nothing else. It does NOT gate the kernel
# builds: build.rs always probes the toolchain and emits the sparkflash_cuda_toolkit cfg that the
# compile-time ABI checks read, so the kernels are parsed whether or not this feature is on. No
# module in this crate calls cudarc yet, so today it adds a dependency and no code path - the
# device/launch path lives in the launcher crate, not here. Enabling it does not currently build:
# the workspace pins cudarc without one of its required cuda-12xxx/13xxx version features, so
# cudarc's own build.rs stops with "Must specify one of the following features: ...". Making it
# build means choosing a version feature (cuda-12090 matches the 12.9 toolkit this repo probes
# with) in the root Cargo.toml, which is outside this crate.
cuda = ["dep:cudarc"]

[dev-dependencies]
# Only examples/m7_layer0.rs --stage 9 uses these. The 40-layer chain is the one harness that needs
# the released Engram seam: the hash layout and the paged table read are engine code, and
# duplicating them in the kernels crate would put a second copy of the released arithmetic next to
# the one the host pair was produced with. sha2 hashes the two determinism blobs; the harness does
# not otherwise hash anything. Neither edge creates a cycle: the engine crate depends on no other
# workspace crate.
sparkflash-engine = { path = "../sparkflash-engine" }
sha2 = { workspace = true }
