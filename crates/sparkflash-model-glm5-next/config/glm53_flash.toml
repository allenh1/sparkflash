# GLM-5.3-Flash (FP8, TP=4) runtime profile.

model = "zai-org/GLM-5.3-Flash"
family = "glm5-next"
weights = "glm5.3-flash-fp8"

[runtime]
context_tokens = 1048576
concurrency = 1

[prefill]
enabled = true
# The arm has always run the code default, `DEFAULT_PREFILL_ROWS` = 4096: this file was created
# as a description of the settings and nothing on the four-rank path installed it until now, so
# the 2048 here never applied. Measured at TP=4 on a 3740-token prompt, 1M window:
#
#   chunk 2048   4.9 GiB scratch   686 tok/s
#   chunk 4096   9.6 GiB scratch   851 tok/s
#
# 4096 is also the documented cap (8,192 does not load), so the file now names it.
chunk = 4096
tensor_cores = true
# `activation` is left unset on purpose: this release has dynamic activations, so the arm's
# default is the FP8 quantiser, and the `split` this file used to name was the other arithmetic.
# It never applied while the profile was inert, which is why the reference was captured against
# the default; naming `split` here would change the served prefill with no recapture.
exact = true

[attention]
latent_cache = "auto"
selected_tokens = 2304

[speculation]
enabled = true
depth = 3

[sequence]
parallel = true
overlap = true

[diagnostics]
profile = false
trace = false
spec_trace = false
