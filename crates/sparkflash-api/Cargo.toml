[package]
name = "sparkflash-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenAI/Anthropic-compatible HTTP+SSE server for SparkFlash-RS"

[features]
# Exposes the synthetic four-rank token-envelope writers for other crates' host tests. The records
# are paper values (UNMEASURED); the feature adds no device dependency.
device-token-fixtures = []

[dependencies]
sparkflash-trace = { workspace = true }
sparkflash-model = { workspace = true }
# Fetches http(s) image URLs (the recipe client: rustls, five redirects); already in the lock via
# tokenizers -> hf-hub.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
http = { workspace = true }
prometheus = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
sparkflash-model-deepseek-v41 = { workspace = true }
sparkflash-vision = { workspace = true }
deepseek-recipe = { workspace = true }
deepseek-recipe-core = { workspace = true }
deepseek-recipe-encoding = { workspace = true }
tokenizers = "0.23"
tower = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }

[[example]]
name = "write_device_window"
# The synthetic window writers live behind the fixtures feature; the default build has no example.
required-features = ["device-token-fixtures"]
