# Qwen3.8-Flash-Next-NVFP4 runtime profile.
#
# The typed source of truth for this arm. A field left unset takes the arm's default; the
# environment variables listed in sparkflash_model::profile::ENV_OVERRIDES remain overrides and
# are documented in docs/adding-a-model.md.

model = "nvidia/Qwen3.8-Flash-Next-NVFP4"
family = "qwen4-exp"
weights = "qwen3.8-flash-next-nvfp4"

[runtime]
context_tokens = 262144
concurrency = 1

[prefill]
enabled = true
chunk = 4096
tensor_cores = true
exact = false

[decode]
tensor_cores = true

[attention]
latent_cache = "auto"
selected_tokens = 2304

[speculation]
enabled = true
# The DFlash 2 block's full width: it proposes block_size - 1 = 7 drafts and the policy decides
# per step how many of them are worth their rows. Measured at TP=4, one stream, 256 tokens,
# median of three (sparkDash's DecodeBench protocol, prose / code):
#
#   depth 3  52.1 / 66.7      depth 5  56.9 / 72.8      depth 7  59.9 / 78.1
#
# Deeper is not free - a fixed depth 7 gives 53.6 on prose - but the adaptive policy backs off
# when the block's confidences are low, so the ceiling can be the whole block.
depth = 7

[sequence]
parallel = true
overlap = true

[diagnostics]
profile = false
trace = false
spec_trace = false
