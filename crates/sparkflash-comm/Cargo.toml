[package]
name = "sparkflash-comm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RoCEnante one-shot RDMA + NCCL dual-path collective transport for 4x DGX Spark"

[features]
default = []
# The real libibverbs backend. It adds no build-time dependency: libibverbs is dlopen'd at run
# time, so a default build still links nothing and the feature only compiles the backend module
# (and the doctor's rocenante-probe fabric path) into the crate.
rdma = []
# The GPU-initiated RDMA all-reduce arm. Design only while nvidia-peermem is root-blocked: the
# feature exists so the ARMED shape cannot rot, and selecting the arm is a typed refusal (never a
# silent fallback to NCCL) until the peermem rebuild lands and the implementation starts.
gpu-rdma-reduce = []
# The declared S1 host-bridge fallback: device->host, the host reduce, host->device. OFF BY DEFAULT
# because it is the one declared exception to "the reduced row never crosses PCIe in steady state":
# it exists for an S1 run whose node cannot start the device arm, it is opened only as
# sparkflash_comm::host_bridge::HostBridgeReduce, and it is typed, counted and labelled
# reduce=host-bridge in the row. A default build refuses it with a typed ArmUnavailable. Enable it
# for an S1 run with --features sparkflash-comm/s1-host-bridge.
s1-host-bridge = []

[dependencies]
serde = { workspace = true }
sparkflash-trace = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }
# rocenante-probe: the argument parser and the JSON document the doctor reads.
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Independent round-to-nearest-even oracle for the bf16 conversion tests.
half = { workspace = true }

[[bin]]
# The doctor's latency instrument. The target name is part of the contract with the doctor, which
# runs rocenante-probe from PATH, so it is pinned here rather than left to file discovery.
name = "rocenante-probe"
path = "src/bin/rocenante-probe.rs"

[[bin]]
# WS-B's four-rank all-reduce microbenchmark (cold + hot, p50/p90, 25 us decode gate). It is a
# separate binary from rocenante-probe so the doctor's field contract stays untouched.
name = "ws-b-allreduce-bench"
path = "src/bin/ws-b-allreduce-bench.rs"

[[bin]]
# Four-rank fabric comparison of the layer's all-reduce arms: the host spawn/join reduce the loop
# runs today versus a dlopen'd vendored libnccl doing one enqueue per call. No GPU is needed to
# build it; the runner is scripts/gpu-reduce-bench.sh.
name = "gpu-reduce-bench"
path = "src/bin/gpu-reduce-bench.rs"

[[bin]]
# Isolated host-only per-call measurement of the served 10 KiB reduce over TCP: sync total,
# and in async mode the post and wait halves separately, with the canonical reference checked
# on every rank. Used by the comm reduce workstream; it touches no GPU and no node config.
name = "comm-reduce-bench"
path = "src/bin/comm-reduce-bench.rs"
