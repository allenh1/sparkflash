[package]
name = "sparkflash-comm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RoCEnante one-shot RDMA + NCCL dual-path collective transport for 4x DGX Spark"

[features]
default = []
# The real libibverbs backend. It adds no build-time dependency: libibverbs is dlopen'd at run
# time, so a default build still links nothing and the feature only compiles the backend module
# (and the doctor's rocenante-probe fabric path) into the crate.
rdma = []

[dependencies]
serde = { workspace = true }
sparkflash-trace = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }
# rocenante-probe: the argument parser and the JSON document the doctor reads.
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Independent round-to-nearest-even oracle for the bf16 conversion tests.
half = { workspace = true }

[[bin]]
# The doctor's latency instrument. The target name is part of the contract with the doctor, which
# runs rocenante-probe from PATH, so it is pinned here rather than left to file discovery.
name = "rocenante-probe"
path = "src/bin/rocenante-probe.rs"

[[bin]]
# WS-B's four-rank all-reduce microbenchmark (cold + hot, p50/p90, 25 us decode gate). It is a
# separate binary from rocenante-probe so the doctor's field contract stays untouched.
name = "ws-b-allreduce-bench"
path = "src/bin/ws-b-allreduce-bench.rs"
