[package]
name = "sparkflash-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Zero-overhead scoped CPU + in-graph GPU trace points for 4x DGX Spark"

[features]
default = ["trace-points"]
# Master compile-time switch: when off, every trace point expands to nothing.
#
# `trace-gpu-in-graph` and `trace-nvtx` used to be declared here and gated nothing: no `cfg` in
# the workspace named either one, so enabling them changed nothing at all, which reads as a
# capability claim. They are deleted until the in-graph ring and the NVTX mirror exist; D15 in
# docs/DECISIONS.md records the decision (review A6, round 4).
trace-points = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
