[package]
name = "sparkflash-deepseek-forward"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "DeepSeek-V4.1-Flash's device forward, out of sparkflash-cli"

[features]
default = []
cuda = ["sparkflash-device/cuda"]
rdma = ["sparkflash-comm/rdma"]

[dependencies]
sparkflash-api = { workspace = true }
sparkflash-comm = { workspace = true }
sparkflash-device = { workspace = true }
sparkflash-engine = { workspace = true }
sparkflash-engram = { workspace = true }
sparkflash-kernels = { workspace = true }
sparkflash-kv = { workspace = true }
sparkflash-model = { workspace = true }
sparkflash-model-deepseek-v41 = { workspace = true }
sparkflash-vision = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
io-uring = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
