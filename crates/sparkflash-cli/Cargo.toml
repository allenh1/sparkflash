[package]
name = "sparkflash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "sparkflash command line interface"

[features]
default = []
# The Phase-1 TP=4 serving path: one process per rank, rank 0 owns the HTTP surface and the
# control channel. Off by default so main and the existing reference server are unchanged until
# the rank adapter lands; build with --features tp4-serve to compile the serve-side types and
# their loopback tests.
tp4-serve = []
# "cuda" forwards to sparkflash-device's cfg gate for the M2 real session (the dlopen driver and
# the pinned router cubin). The default binary has no device session path; a cuda build still links
# no libcuda, and the session is only constructed with --engine device --device-cubin PATH. The M3-a
# device-chain plan arm needs no feature: it opens no driver.
cuda = ["sparkflash-device/cuda"]
# The real libibverbs RDMA backend, forwarded from sparkflash-comm. No build dependency is added
# (libibverbs is dlopen'd at run time); this only compiles the backend in and makes
# --comm-backend rdma reachable. The four-node window is still what the run needs.
rdma = ["sparkflash-comm/rdma"]

[[bin]]
name = "sparkflash"
path = "src/main.rs"

[dependencies]
sparkflash-trace = { workspace = true }
sparkflash-api = { workspace = true }
sparkflash-engram = { workspace = true }
sparkflash-kv = { workspace = true }
sparkflash-comm = { workspace = true }
sparkflash-kernels = { workspace = true }
sparkflash-scheduler = { workspace = true }
sparkflash-engine = { workspace = true }
sparkflash-device = { workspace = true }
axum = { workspace = true }
# The streaming detokeniser step: host continuous batching keeps the tokenizers DecodeStream state
# in its per-request scheduler slots, and step_decode_stream is the crate's public entry for it.
tokenizers = "0.23"
futures = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# The `--checkpoint` fixture tests build a tiny safetensors checkpoint in a temporary directory.
tempfile = { workspace = true }
# The device-token window tests write a synthetic four-rank envelope: paper records, UNMEASURED.
sparkflash-api = { workspace = true, features = ["device-token-fixtures"] }
