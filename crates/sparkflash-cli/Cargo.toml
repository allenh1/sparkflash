[package]
name = "sparkflash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "sparkflash command line interface"

[features]
default = []
# "cuda" forwards to sparkflash-device's cfg gate for the M2 real session (the dlopen driver and
# the pinned router cubin). The default binary has no device session path; a cuda build still links
# no libcuda, and the session is only constructed with --engine device --device-cubin PATH. The M3-a
# device-chain plan arm needs no feature: it opens no driver.
cuda = ["sparkflash-device/cuda"]

[[bin]]
name = "sparkflash"
path = "src/main.rs"

[dependencies]
sparkflash-trace = { workspace = true }
sparkflash-api = { workspace = true }
sparkflash-engram = { workspace = true }
sparkflash-kv = { workspace = true }
sparkflash-comm = { workspace = true }
sparkflash-kernels = { workspace = true }
sparkflash-scheduler = { workspace = true }
sparkflash-engine = { workspace = true }
sparkflash-device = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The `--checkpoint` fixture tests build a tiny safetensors checkpoint in a temporary directory.
tempfile = { workspace = true }
