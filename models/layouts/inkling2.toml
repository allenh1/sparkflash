[[stacks.language.parts.facts]]
name = "gate_softcap"
value = { key = "text_config.mlp_gate_softcap" }
[[stacks.language.parts.facts]]
name = "up_softcap"
value = { key = "text_config.mlp_up_softcap" }

# src/tensor.rs:204-227: embedding, norms and untied head; the vocabulary axis is a rows split (TpAxis::Vocab and TpAxis::Heads divide the same way).

[[tensor]]
name = "model.llm.embed.weight"
part = "embedding"
role = "embedding"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "rows"

[[tensor]]
name = "model.llm.embed_norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"

[[tensor]]
name = "model.llm.norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"

[[tensor]]
name = "model.llm.unembed.weight"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "rows"

# src/tensor.rs:228-263: one output query plus bank b at layer b+1; a full layer's bank is three queries, a sliding layer's one. The arm's block-residual role has no shared role name, so these are tagged attention.

