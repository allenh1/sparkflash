part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["hidden", "heads * head_dim"]
split = "columns"
repeat = "layers"

# text_config.d_rel is 16; the relative bank is [heads * d_rel, hidden] (src/tensor.rs:327-332).

