# Inkling-2-Small layout.
#
# Sources, in the order the layout spec gives them:
#   * the checkpoint's config.json: the nested text_config, vision_config and mtp_config;
#   * the tensor index: every stored name, dtype and shape in model-*.safetensors and
#     mtp.safetensors (1854 tensors);
#   * the arm crate crates/sparkflash-model-inkling2, which runs the released checkpoint today
#     and is the only published reference code for this producer: src/tensor.rs (names, shapes,
#     rank splits), src/vision.rs (tower wiring and arithmetic) and src/config.rs (typed
#     geometry). There is no reference/ directory for this producer.
#
# Shapes are expressions over the facts the shared reader derives from config.json. Where the
# reader exposes no fact (the short-convolution taps, d_rel, rel_extent, the position grid and
# every MTP dimension) the stored dimension is written as the literal the index states, and the
# comment names the config key it comes from.
#
# Known format gaps, recorded rather than worked around (see the PR report):
#   * the routed experts are stacked per layer with an expert axis; no tensor declaration can
#     express a 3-D stacked expert tensor or split its expert axis, so those 352 tensors are
#     left unclaimed;
#   * the MTP stage has five layers and its own geometry; the reader has no repeat over stages,
#     so the 84 stage tensors are listed explicitly.

schema = 1
id = "inkling2-small"

[match]
# config.json architectures and model_type. This is the only family-string comparison.
architectures = ["Inkling2ForConditionalGeneration"]
model_types = ["inkling2"]

[[keys]]
# config.json text_config.q_bias.
path = "text_config.q_bias"
ignore = "text_config.q_bias is false: no query bias tensor exists in the index, and the shared attention description reads its bias switch from the root attention_bias key; the arm's typed parser is the reader that keeps this per-projection switch"

[[keys]]
# config.json text_config.o_bias.
path = "text_config.o_bias"
ignore = "text_config.o_bias is false: no output-projection bias tensor exists in the index; the shared attention description has no per-projection bias field, and the arm's typed parser keeps the switch"

[[keys]]
# config.json text_config.pre_norm_pre_affine.
path = "text_config.pre_norm_pre_affine"
ignore = "text_config.pre_norm_pre_affine is false, so the pre-norm is a plain RMSNorm; the shared description has no pre-affine field to carry a true value and the arm's typed parser keeps it"

[[keys]]
# config.json text_config.final_norm_pre_affine.
path = "text_config.final_norm_pre_affine"
ignore = "text_config.final_norm_pre_affine is false, so the final norm is a plain RMSNorm; the shared description has no pre-affine field and the arm's typed parser keeps it"

[[keys]]
# config.json text_config.swa_head_dim.
path = "text_config.swa_head_dim"
ignore = "the sliding layers' head width (128) equals text_config.head_dim, which the shared reader already reads; the arm's typed parser keeps the sliding spelling"

[[keys]]
# config.json text_config.swa_num_attention_heads.
path = "text_config.swa_num_attention_heads"
ignore = "the sliding layers' query-head count (48) equals text_config.num_attention_heads, which the shared reader already reads; the arm's typed parser keeps the sliding spelling"

[[keys]]
# config.json text_config.swa_num_key_value_heads.
path = "text_config.swa_num_key_value_heads"
ignore = "the sliding layers' key/value-head count (8) equals text_config.num_key_value_heads, which the shared reader already reads; the arm's typed parser keeps the sliding spelling"

[[keys]]
# config.json text_config.use_gate_bias.
path = "text_config.use_gate_bias"
ignore = "true here, and proved by the stored model.llm.layers.*.mlp.gate.bias tensor; the router bias is claimed as its own tensor below and the shared MoE description selects its bias from the tensor name, so the switch itself is not read"

[[keys]]
# config.json vision_config.projector_bias.
path = "vision_config.projector_bias"
ignore = "false here, and proved by the stored proj_in/proj_out tensors having no bias; the shared vision description has no projector-bias field, and the arm's typed parser keeps the switch"

[[keys]]
# config.json mtp_config.hidden_size.
path = "mtp_config.hidden_size"
ignore = "the MTP stage width is 4608 and equals text_config.hidden_size, which the shared reader reads for the backbone; the stage's tensors below carry their own shapes and the arm's typed parser keeps the stage field"

[[keys]]
# config.json mtp_config.num_attention_heads.
path = "mtp_config.num_attention_heads"
ignore = "the MTP stage's 48 query heads are not read by the shared draft description; the stage's tensors below carry their stored shapes and the arm's typed parser keeps the field"

[[keys]]
# config.json mtp_config.num_key_value_heads.
path = "mtp_config.num_key_value_heads"
ignore = "the MTP stage's 8 key/value heads are not read by the shared draft description; the stage's tensors below carry their stored shapes and the arm's typed parser keeps the field"

[[keys]]
# config.json mtp_config.head_dim.
path = "mtp_config.head_dim"
ignore = "the MTP stage's 128-wide head is not read by the shared draft description; the stage's tensors below carry their stored shapes and the arm's typed parser keeps the field"

[[keys]]
# config.json mtp_config.intermediate_size.
path = "mtp_config.intermediate_size"
ignore = "the MTP stage's 18432-wide MLP is not read by the shared draft description; the stage's tensors below carry their stored shapes and the arm's typed parser keeps the field"

[[keys]]
# config.json mtp_config.max_position_embeddings.
path = "mtp_config.max_position_embeddings"
ignore = "the MTP stage's context limit is not arithmetic the draft stack executes in the shared description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.q_bias.
path = "mtp_config.q_bias"
ignore = "false: the MTP stage stores no q_proj bias in mtp.safetensors; the arm's typed parser keeps the switch"

[[keys]]
# config.json mtp_config.o_bias.
path = "mtp_config.o_bias"
ignore = "false: the MTP stage stores no o_proj bias in mtp.safetensors; the arm's typed parser keeps the switch"

[[keys]]
# config.json mtp_config.rms_norm_eps.
path = "mtp_config.rms_norm_eps"
ignore = "the MTP stage's 1e-6 RMS epsilon is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.rope_theta.
path = "mtp_config.rope_theta"
ignore = "the MTP stage's 1e6 rotary base is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.local_layer_ids.
path = "mtp_config.local_layer_ids"
ignore = "the MTP stage's sliding-layer schedule is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.sliding_window_size.
path = "mtp_config.sliding_window_size"
ignore = "the MTP stage's 1024-token window is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.markov_rank.
path = "mtp_config.markov_rank"
ignore = "the MTP stage's 256-wide Markov head is a stage-only tensor shape (markov_head.* below); the shared draft description has no field for it and the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.markov_head_type.
path = "mtp_config.markov_head_type"
ignore = "the MTP stage's rnn_hidden Markov head is a stage-only wiring fact; the shared draft description has no field for it and the arm's typed parser keeps it"

[stacks.language]
# src/tensor.rs:265-520 walks each layer as mlp_norm, the attention branch, the MLP/router,
# inside the block-attention residual, with a short convolution on both branches.
order = [
  "embedding",
  "rms_norm",
  "lm_head",
  "block_attention_residual",
  "gqa_attention",
  "relative_attention",
  "short_conv",
  "moe",
  "softcapped_activation",
]

[stacks.draft]
order = ["mtp"]

[stacks.vision]
# src/vision.rs:381-470: patch embedding, learned 32x32 position grid, LayerNorm blocks,
# axial rotary attention, erf-GELU MLP, proj_in -> erf-GELU -> proj_out merger.
order = [
  "vision_patch_embed",
  "vision_position",
  "vision_norm",
  "vision_attention",
  "vision_mlp",
  "vision_merger",
]

# src/vision.rs:208-235 and 397-408: the tower resamples a learned 32x32 grid and stores no
# rotary base; the index agrees (position_embedding is stored, no rope table). This is the one
# vision fact the shared reader applies.
[[stacks.vision.parts]]
part = "vision_position"
[[stacks.vision.parts.facts]]
name = "position"
value = "grid"

# The facts below are carried with their sources. The shared reader's apply_facts only applies
# vision.position today, so the scan rows they describe stay unknown layout until it learns the
# fields; they are recorded here rather than guessed in Rust.
[[stacks.vision.parts]]
part = "vision_norm"
[[stacks.vision.parts.facts]]
name = "norm"
value = "layer"
[[stacks.vision.parts.facts]]
name = "epsilon_key"
value = "vision_config.layer_norm_eps"

[[stacks.vision.parts]]
part = "vision_attention"
[[stacks.vision.parts.facts]]
name = "position"
value = "axial_rotary"
[[stacks.vision.parts.facts]]
name = "qk_norm"
value = false
[[stacks.vision.parts.facts]]
name = "attention_bias"
value = true

[[stacks.vision.parts]]
part = "vision_mlp"
[[stacks.vision.parts.facts]]
name = "activation"
value = "gelu_erf"
[[stacks.vision.parts.facts]]
name = "intermediate"
value = "4 * hidden"

[[stacks.vision.parts]]
part = "vision_merger"
[[stacks.vision.parts.facts]]
name = "activation"
value = "gelu_erf"
[[stacks.vision.parts.facts]]
name = "final_norm"
value = false
[[stacks.vision.parts.facts]]
name = "input"
value = "merged_patch_cell"

[[stacks.vision.parts]]
part = "vision_patch_embed"
[[stacks.vision.parts.facts]]
name = "temporal_fold"
value = 1

[[stacks.language.parts]]
part = "block_attention_residual"
[[stacks.language.parts.facts]]
name = "layers_per_block"
value = { key = "text_config.n_layers_per_attn_res_block" }
[[stacks.language.parts.facts]]
name = "sliding_queries"
value = 1
[[stacks.language.parts.facts]]
name = "full_queries"
value = 3
[[stacks.language.parts.facts]]
name = "mlp_queries"
value = 1
[[stacks.language.parts.facts]]
name = "normalize"
value = { key = "text_config.attn_res_normalize_values" }

[[stacks.language.parts]]
part = "gqa_attention"
[[stacks.language.parts.facts]]
name = "relative_bias"
value = true
[[stacks.language.parts.facts]]
name = "attention_sink"
value = true
[[stacks.language.parts.facts]]
name = "output_gate"
value = true
[[stacks.language.parts.facts]]
name = "qk_l2_clip"
value = { key = "text_config.qk_l2_clip_threshold" }
[[stacks.language.parts.facts]]
name = "rel_l2_clip"
