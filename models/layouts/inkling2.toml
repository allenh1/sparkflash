# Inkling-2-Small layout.
#
# Sources, in the order the layout spec gives them:
#   * config.json: text_config, vision_config and mtp_config;
#   * the tensor index: every stored name, dtype and shape in model-*.safetensors and
#     mtp.safetensors (1854 tensors);
#   * the arm crate crates/sparkflash-model-inkling2, which runs the released checkpoint today
#     and is the only published reference code for this producer: src/tensor.rs (names, shapes,
#     rank splits), src/vision.rs (tower wiring and arithmetic) and src/config.rs (typed
#     geometry). There is no reference/ directory for this producer.
#
# Every shape is an expression over the reader's facts or the [vars] below, which read their
# config keys.

schema = 1
id = "inkling2-small"

[match]
# config.json architectures and model_type. This is the only family-string comparison.
architectures = ["Inkling2ForConditionalGeneration"]
model_types = ["inkling2"]

[vars]
# A shape fact the reader does not derive. Each key is claimed by this layout.
sconv_kernel = { key = "text_config.sconv_kernel_size" }
d_rel = { key = "text_config.d_rel" }
rel_extent = { key = "text_config.rel_extent" }
vision_posemb_grid = { key = "vision_config.posemb_grid_size", default = 32 }
mtp_hidden = { key = "mtp_config.hidden_size", default = 4608 }
mtp_heads = { key = "mtp_config.num_attention_heads", default = 48 }
mtp_kv_heads = { key = "mtp_config.num_key_value_heads", default = 8 }
mtp_head_dim = { key = "mtp_config.head_dim", default = 128 }
mtp_intermediate = { key = "mtp_config.intermediate_size", default = 18432 }
mtp_markov_rank = { key = "mtp_config.markov_rank", default = 256 }
mtp_block = { key = "mtp_config.block_size", default = 8 }

[[keys]]
# config.json text_config.q_bias.
path = "text_config.q_bias"
ignore = "text_config.q_bias is false: no query bias tensor exists in the index, and the shared attention description reads its bias switch from the root attention_bias key; the arm's typed parser keeps this per-projection switch"

[[keys]]
# config.json text_config.o_bias.
path = "text_config.o_bias"
ignore = "text_config.o_bias is false: no output-projection bias tensor exists in the index; the shared attention description has no per-projection bias field, and the arm's typed parser keeps the switch"

[[keys]]
# config.json text_config.pre_norm_pre_affine.
path = "text_config.pre_norm_pre_affine"
ignore = "text_config.pre_norm_pre_affine is false, so the pre-norm is a plain RMSNorm; the shared description has no pre-affine field to carry a true value and the arm's typed parser keeps it"

[[keys]]
# config.json text_config.final_norm_pre_affine.
path = "text_config.final_norm_pre_affine"
ignore = "text_config.final_norm_pre_affine is false, so the final norm is a plain RMSNorm; the shared description has no pre-affine field and the arm's typed parser keeps it"

[[keys]]
# config.json text_config.swa_head_dim.
path = "text_config.swa_head_dim"
ignore = "the sliding layers' head width (128) equals text_config.head_dim, which the shared reader already reads; the arm's typed parser keeps the sliding spelling"

[[keys]]
# config.json text_config.swa_num_attention_heads.
path = "text_config.swa_num_attention_heads"
ignore = "the sliding layers' query-head count (48) equals text_config.num_attention_heads, which the shared reader already reads; the arm's typed parser keeps the sliding spelling"

[[keys]]
# config.json text_config.swa_num_key_value_heads.
path = "text_config.swa_num_key_value_heads"
ignore = "the sliding layers' key/value-head count (8) equals text_config.num_key_value_heads, which the shared reader already reads; the arm's typed parser keeps the sliding spelling"

[[keys]]
# config.json text_config.use_gate_bias.
path = "text_config.use_gate_bias"
ignore = "true here, and proved by the stored model.llm.layers.*.mlp.gate.bias tensor; the router bias is claimed as its own tensor below and the shared MoE description selects its bias from the tensor name, so the switch itself is not read"

[[keys]]
# config.json vision_config.projector_bias.
path = "vision_config.projector_bias"
ignore = "false here, and proved by the stored proj_in/proj_out tensors having no bias; the shared vision description learns the merger from the layout facts below and has no projector-bias field"

[[keys]]
# config.json mtp_config.max_position_embeddings.
path = "mtp_config.max_position_embeddings"
ignore = "the MTP stage's context limit is not arithmetic the draft stack executes in the shared description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.q_bias.
path = "mtp_config.q_bias"
ignore = "false: the MTP stage stores no q_proj bias in mtp.safetensors; the arm's typed parser keeps the switch"

[[keys]]
# config.json mtp_config.o_bias.
path = "mtp_config.o_bias"
ignore = "false: the MTP stage stores no o_proj bias in mtp.safetensors; the arm's typed parser keeps the switch"

[[keys]]
# config.json mtp_config.rms_norm_eps.
path = "mtp_config.rms_norm_eps"
ignore = "the MTP stage's 1e-6 RMS epsilon is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.rope_theta.
path = "mtp_config.rope_theta"
ignore = "the MTP stage's 1e6 rotary base is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.local_layer_ids.
path = "mtp_config.local_layer_ids"
ignore = "the MTP stage's sliding-layer schedule is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.sliding_window_size.
path = "mtp_config.sliding_window_size"
ignore = "the MTP stage's 1024-token window is not a field of the shared draft description; the arm's typed parser keeps it"

[[keys]]
# config.json mtp_config.markov_head_type.
path = "mtp_config.markov_head_type"
ignore = "the MTP stage's rnn_hidden Markov head is a stage-only wiring fact; the shared draft description has no field for it and the arm's typed parser keeps it"

[stacks.language]
# src/tensor.rs:265-520: each layer is mlp_norm, the attention branch, the MLP/router, inside
# the block-attention residual, with a short convolution on both branches.
order = [
  "embedding",
  "rms_norm",
  "lm_head",
  "block_attention_residual",
  "relative_attention",
  "short_conv",
  "moe",
  "softcapped_activation",
]

[stacks.draft]
order = ["mtp"]

[stacks.vision]
# src/vision.rs:381-470: patch embedding, learned position grid, LayerNorm blocks, axial rotary
# attention, erf-GELU MLP, proj_in -> erf-GELU -> proj_out merger.
order = [
  "vision_patch_embed",
  "vision_position",
  "vision_norm",
  "vision_attention",
  "vision_mlp",
  "vision_merger",
]

# src/vision.rs:208-235 and 397-408: the tower stores a learned 32x32 grid and no rotary base.
[[stacks.vision.parts]]
part = "vision_position"
[[stacks.vision.parts.facts]]
name = "position"
value = "rotary_and_grid"

# src/vision.rs:554-630: LayerNorm blocks with layer scale; attention has a bias, no qk norm,
# and axial rotary; the MLP is exact erf-GELU.
[[stacks.vision.parts]]
part = "vision_norm"
[[stacks.vision.parts.facts]]
name = "norm"
value = "layer"
[[stacks.vision.parts.facts]]
name = "norm_epsilon"
value = { key = "vision_config.layer_norm_eps", default = 1e-5 }

[[stacks.vision.parts]]
part = "vision_attention"
[[stacks.vision.parts.facts]]
name = "attention_bias"
value = true
[[stacks.vision.parts.facts]]
name = "qk_norm"
value = false

[[stacks.vision.parts]]
part = "vision_mlp"
[[stacks.vision.parts.facts]]
name = "activation"
value = "gelu_erf"

# src/vision.rs:637-642 and 675-680: one projection per merge cell, erf-GELU, then the output
# projection; no final norm and no separate downsample (the four patches are concatenated).
[[stacks.vision.parts]]
part = "vision_merger"
[[stacks.vision.parts.facts]]
name = "merger_activation"
value = "gelu_erf"
[[stacks.vision.parts.facts]]
name = "merger_final_norm"
value = false
[[stacks.vision.parts.facts]]
name = "downsample"
value = "merge"

[[stacks.language.parts]]
part = "block_attention_residual"
[[stacks.language.parts.facts]]
name = "layers_per_block"
value = { key = "text_config.n_layers_per_attn_res_block" }
[[stacks.language.parts.facts]]
name = "sliding_queries"
value = 1
[[stacks.language.parts.facts]]
name = "full_queries"
value = 3
[[stacks.language.parts.facts]]
name = "mlp_queries"
value = 1
[[stacks.language.parts.facts]]
name = "normalize"
value = { key = "text_config.attn_res_normalize_values" }

[[stacks.language.parts]]
part = "relative_attention"
[[stacks.language.parts.facts]]
name = "relative_bias"
value = true
[[stacks.language.parts.facts]]
name = "attention_sink"
value = true
[[stacks.language.parts.facts]]
name = "output_gate"
value = true
[[stacks.language.parts.facts]]
name = "width"
value = { key = "text_config.d_rel" }
[[stacks.language.parts.facts]]
name = "extent"
value = { key = "text_config.rel_extent" }
[[stacks.language.parts.facts]]
name = "qk_l2_clip"
value = { key = "text_config.qk_l2_clip_threshold" }
[[stacks.language.parts.facts]]
name = "rel_l2_clip"
value = { key = "text_config.rel_l2_clip_threshold" }

[[stacks.language.parts]]
part = "short_conv"
[[stacks.language.parts.facts]]
name = "kernel"
value = { key = "text_config.sconv_kernel_size" }

[[stacks.language.parts]]
part = "moe"
[[stacks.language.parts.facts]]
name = "routed"
value = { key = "text_config.n_routed_experts" }
[[stacks.language.parts.facts]]
name = "active"
value = { key = "text_config.num_experts_per_tok" }

[[stacks.language.parts]]
part = "softcapped_activation"
[[stacks.language.parts.facts]]
name = "gate_softcap"
value = { key = "text_config.mlp_gate_softcap" }
[[stacks.language.parts.facts]]
name = "up_softcap"
value = { key = "text_config.mlp_up_softcap" }

# src/tensor.rs:204-227: embedding, norms and untied head; the vocabulary axis is a rows split.

[[tensor]]
name = "model.llm.embed.weight"
part = "embedding"
role = "embedding"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "rows"

[[tensor]]
name = "model.llm.embed_norm.weight"
