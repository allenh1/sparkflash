# src/tensor.rs:303-362: the fused query/dual, key/value, gate, relative and sink projections and the two L2 clip scales.

[[tensor]]
name = "model.llm.layers.{layer}.attn.wq_du.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * head_dim", "hidden"]
split = "rows"
repeat = "layers"

# src/tensor.rs:861-875: a key/value projection is split on the key/value-head axis, not on its rows.

[[tensor]]
name = "model.llm.layers.{layer}.attn.wk_dv.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["kv_heads * head_dim", "hidden"]
