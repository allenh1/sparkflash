shape = ["hyper_width", 1, "ple_conv"]
split = "whole"
repeat = "layers"
when = { side = "ple" }

# The n-gram table's hash constants, per-tensor scale and shards. The prime bucket layout gives
# ple_rows; each of the ple_shards shards holds ple_shard_rows rows of ple_head_dim.
[[tensor]]
