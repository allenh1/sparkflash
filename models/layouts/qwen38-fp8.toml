# PLE: only the layer config.json text_config.ple_layer_ids names carries these tensors.
# when.layers selects the released layer (1, ple_layer_ids [2]); the ple_* facts come from that
# layer's Side::Ple. The layers and shards follow src/ngram.rs and src/ple.rs; tensor.rs states
