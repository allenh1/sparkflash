part = "ple"
role = "ple_table"
dtype = "i64"
shape = ["ple_ngram"]
split = "whole"
repeat = "layers"
when = { side = "ple" }

[[tensor]]
name = "model.language_model.layers.{layer}.ple.ple_embedding.ngram_heads_offsets"
part = "ple"
role = "ple_table"
dtype = "i64"
shape = ["ple_heads"]
split = "whole"
repeat = "layers"
when = { side = "ple" }

[[tensor]]
name = "model.language_model.layers.{layer}.ple.ple_embedding.ngram_heads_vocab_sizes"
part = "ple"
role = "ple_table"
dtype = "i64"
shape = ["ple_heads"]
split = "whole"
repeat = "layers"
when = { side = "ple" }

[[tensor]]
name = "model.language_model.layers.{layer}.ple.ple_embedding.ngram_embedding.weight_scale"
part = "ple"
role = "ple_table"
dtype = "bf16"
shape = [1]
split = "whole"
repeat = "layers"
when = { side = "ple" }

[[tensor]]
name = "model.language_model.layers.{layer}.ple.ple_embedding.ngram_embedding.shard_{shard}.weight"
part = "ple"
role = "ple_table"
dtype = "f8e4m3"
shape = ["ple_shard_rows", "ple_head_dim"]
split = "whole"
repeat = "ple_shards"
when = { side = "ple" }


