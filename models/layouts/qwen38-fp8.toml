part = "ple"
role = "ple_aux"
dtype = "bf16"
shape = ["hyper_width"]
split = "whole"
repeat = "layers"
when = { side = "ple" }

[[tensor]]
name = "model.language_model.layers.{layer}.ple.norm_query.weight"
part = "ple"
role = "ple_aux"
dtype = "bf16"
