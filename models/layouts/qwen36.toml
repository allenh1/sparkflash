ignore = "the producer's modules kept out of the FP8 pass; the tensor index states every stored dtype"

[[keys]]
# config.json text_config.mtp_use_dedicated_embeddings: false in the carried document.
path = "text_config.mtp_use_dedicated_embeddings"
ignore = "false in the carried document; the MTP stage takes the embedding and final hidden state the plan already names"

[[keys]]
# config.json text_config.mtp_num_hidden_layers: the stage count.
path = "text_config.mtp_num_hidden_layers"
ignore = "the stage count is read by the parser that builds the MTP stage; the layout names the one stage it describes"

# Model keys this family ignores; each is a producer or training switch the arm's typed parser
# reads, never a shared shape fact.

[[keys]]
