ignore = "empty in both released Qwen3.8 documents, so no deepstack tap is selected; the merger tensors are the only tower-to-language projection"

# The producer's BF16 exclusion list. The tensor index states every stored dtype, so the
# list is the producer's second statement of the same fact.
[[keys]]
