[[keys]]
# config.json text_config.router_aux_loss_coef: the producer's training-time load-balancing loss coefficient; inference computes no loss.
path = "text_config.router_aux_loss_coef"
ignore = "the producer's training-time load-balancing loss coefficient; inference computes no loss"

[[keys]]
# config.json text_config.use_cache: a producer output switch for returning the KV cache; serving always keeps the cache.
path = "text_config.use_cache"
ignore = "a producer output switch for returning the KV cache; serving always keeps the cache"

[[keys]]
# config.json vision_config.initializer_range: the producer's training-time weight initialization range; this family derives no inference geometry from it.
path = "vision_config.initializer_range"
ignore = "the producer's training-time weight initialization range; this family derives no inference geometry from it"

[stacks.language]
order = [
  "embedding",
  "rms_norm",
  "gdn_scan",
  "gqa_attention",
  "moe",
]

[stacks.draft]
order = ["mtp"]

[stacks.vision]
order = [
  "vision_patch_embed",
  "vision_position",
  "vision_norm",
  "vision_attention",
  "vision_mlp",
  "vision_merger",
]

# src/vision.rs:2304 and 423-447: a learned 2304-entry position grid is resampled and axial
# rotary is applied. The tensor index stores model.visual.pos_embed.weight.
[[stacks.vision.parts]]
part = "vision_position"
[[stacks.vision.parts.facts]]
name = "position"
value = "rotary_and_grid"

# src/vision.rs:54: every tower LayerNorm uses 1e-6; the config states no vision epsilon.
# src/vision.rs:454-523: the block norm is LayerNorm with a learned bias; the arm's
# reference uses layer_norm for norm1 and norm2. The config states no norm kind or bias.
[[stacks.vision.parts]]
part = "vision_norm"
[[stacks.vision.parts.facts]]
name = "norm"
value = "layer"
[[stacks.vision.parts.facts]]
name = "norm_epsilon"
value = 1e-6

# src/vision.rs:423-523: qkv and proj carry biases and the block applies no per-head q/k
# norm; the tensor index stores .attn.qkv.bias and .attn.proj.bias and no q_norm/k_norm.
[[stacks.vision.parts]]
part = "vision_attention"
[[stacks.vision.parts.facts]]
name = "attention_bias"
value = true
[[stacks.vision.parts.facts]]
name = "qk_norm"
value = false

# src/vision.rs:523-558: the merger applies erf GELU before linear_fc1 and no norm after the
# projection.
[[stacks.vision.parts]]
part = "vision_merger"
[[stacks.vision.parts.facts]]
name = "merger_activation"
value = "gelu_erf"
[[stacks.vision.parts.facts]]
name = "merger_final_norm"
value = false

