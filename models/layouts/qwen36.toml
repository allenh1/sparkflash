# Qwen3.6-35B-A3B FP8 layout.
#
# Sources, in the order the layout spec gives them:
#   * the checkpoint's config.json (a config key is named beside the fact it sets);
#   * the tensor index (a tensor's presence and stored shape prove the component);
#   * the arm that runs the model today, crates/sparkflash-model-qwen4-exp: its reference
#     forward (src/forward.rs), its vision tower (src/vision.rs), its typed parser
#     (src/config.rs) and the shared planner it reads
#     (crates/sparkflash-ops/src/tensor_plan.rs, fn qwen and helpers).
#     The carried document is crates/sparkflash-model/config/qwen36_flash_35b_a3b_fp8.hf.json.
#
# This is the plain-residual branch of the Qwen family: model.norm and a pre-norm a branch,
# no hyper-connection, no PLE and no QSA indexer. Its dense projections and routed experts are
# E4M3 with one BF16 inverse scale a 128x128 tile; norms, routers and the short convolution
# stay BF16. The MTP stage is the plain branch too, with an ordinary fc pair.

schema = 1
id = "qwen36-35b-a3b-fp8"

[match]
architectures = ["Qwen3_5MoeForConditionalGeneration"]
model_types = ["qwen3_5_moe"]
quantization = ["fp8"]

[vars]
vision_positions = { key = "vision_config.num_position_embeddings", default = 2304 }

# Config keys the description decodes through this layout. Every key below is one the shared
# parser does not read: the producer's quantizer bookkeeping, the nested producer type words,
# and switches the released documents restate rather than change.
[[keys]]
# config.json text_config.model_type: the nested producer type, matched here only.
path = "text_config.model_type"
ignore = "the nested producer type is matched by the root architectures/model_type this layout compares; the arm's typed parser reads it and the shared reader derives the family from the nested stack"

[[keys]]
# config.json vision_config.model_type: the nested tower type, matched here only.
path = "vision_config.model_type"
ignore = "the nested tower type is matched by the root architectures/model_type this layout compares; the shared vision reader derives the tower from its structural keys"

[[keys]]
# config.json tie_word_embeddings: duplicated inside text_config, which the parser reads.
path = "tie_word_embeddings"
ignore = "text_config.tie_word_embeddings is the field the description reads; this root copy states the same value"

[[keys]]
# config.json language_model_only: a producer output switch, not a stack declaration.
path = "language_model_only"
ignore = "a producer output switch; vision_config and the tensor index decide which stacks the checkpoint carries"

[[keys]]
# config.json text_config.full_attention_interval: the layer_types list is the schedule.
path = "text_config.full_attention_interval"
ignore = "the layer_types list is the attention schedule the parser reads; this interval restates the same pattern"

[[keys]]
# config.json text_config.mamba_ssm_dtype: the GDN recurrent state's precision.
path = "text_config.mamba_ssm_dtype"
ignore = "the GDN recurrence runs in f32 in the arm's device step and the tensor plan has no state dtype; this hint changes no planned tensor"

[[keys]]
# config.json text_config.number_of_conv_states: restates the layer schedule's conv states.
path = "text_config.number_of_conv_states"
ignore = "the convolution state count follows from the GDN layer schedule and the conv kernel; no planned tensor is sized from this field"

[[keys]]
# config.json text_config.mtp.layer_types: the MTP stage has one full-attention block.
path = "text_config.mtp.layer_types"
ignore = "the MTP stage's one block takes the first full-attention layer's wiring; this list names that same full-attention type"

[[keys]]
# config.json text_config.mtp.mtp_use_hidden_state_from_layer: null in the release.
path = "text_config.mtp.mtp_use_hidden_state_from_layer"
ignore = "null in both released Qwen3.8 documents; the stage reads the final hidden state, which is the planner's default"

[[keys]]
# config.json text_config.mtp.rope_theta: equals the language rotary base.
path = "text_config.mtp.rope_theta"
ignore = "equal to text_config.rope_parameters.rope_theta (10000000) in both released documents; the stage takes the reference layer's rotary base"

[[keys]]
# config.json text_config.rope_parameters.mrope_interleaved: the arm's rotary layout.
path = "text_config.rope_parameters.mrope_interleaved"
ignore = "the arm's rotary step reads the mRoPE interleaving itself; the shared tensor plan's names and shapes do not depend on the order"

[[keys]]
# config.json text_config.rope_parameters.rope_type: 'default' in both releases.
path = "text_config.rope_parameters.rope_type"
ignore = "both released documents name the unscaled default rotary; the parser already reads the theta and partial factor"

