# DeepSeek-V4.1-Flash layout.
#
# Wiring sources, in the order the layout spec gives them:
#   * the checkpoint's own config.json (a key is named beside the fact it sets);
#   * the tensor index (a tensor name proves the component, its dtype and its stored shape);
#   * the producer's published reference for what neither states:
#     inference/model.py and inference/vision.py from the released checkpoint
#     (revision 1bae0e1088993b9b82de08f59de5be5a34e42170). The checkpoint ships those two
#     files beside its weights; the line numbers below are that copy.
#
# Every shape is an arithmetic expression over a config fact or an architecture fact. Config
# arrays are read as array vars, so the Engram row count is engram_rows[list] on the layer the
# same list position names, and the MTP target count is the target array's length.
#
# Quantized classes, sourced from the tensor index and the arm's tensor.rs:
#   * dense FP8: E4M3 codes with a 32x32 UE8M0 scale grid (model.py:759-761, tensor.rs dense());
#   * routed/MTP experts: E2M1 codes with one UE8M0 scale per output row per 32 along K
#     (dtype::expert_scale_shape, tensor.rs expert());
#   * the Engram table and its wkv projection are E4M3 with the 32x32 grid
#     (tensor.rs push_engram, model.py:344-345).

schema = 1
id = "deepseek-v41-flash"

[match]
architectures = ["DeepseekV41ForCausalLM"]
model_types = ["deepseek_v41"]

# Scalar shape facts whose config key is not one of the architecture's named fields. The
# reader records each key as read, so no key is double-reported.
[vars]
# config.json text_config.o_groups / o_lora_rank: the grouped low-rank output geometry
# (model.py:785-787: wo_a is [o_groups * o_lora, heads * head_dim / o_groups]).
o_groups = { key = "text_config.o_groups" }
o_lora = { key = "text_config.o_lora_rank" }

# config.json text_config.engram_*: the table width, n-gram orders and per-order head count
# (model.py:328-356 derives the fetched width from them).
engram_heads = { key = "text_config.engram_n_heads" }
engram_head_dim = { key = "text_config.engram_head_dim" }
engram_ngram = { key = "text_config.engram_max_ngram_size" }

# config.json text_config.engram_layer_ids / engram_num_embeddings: the layers that carry an
# Engram and one table row count per entry. The listed repeat and rows[list] keep the two arrays
# paired without naming a layer or a count.
engram_ids = { key = "text_config.engram_layer_ids", array = true }
engram_rows = { key = "text_config.engram_num_embeddings", array = true }

# config.json text_config.kv_source_layer_ids / index_source_layer_ids: the layers that own the
# compressed KV and the sparse indexer.
kv_source_ids = { key = "text_config.kv_source_layer_ids", array = true }
index_source_ids = { key = "text_config.index_source_layer_ids", array = true }

# config.json text_config.compress_ratios: one ratio per layer. The compressor gate is stored
# only where the ratio exceeds one, so the threshold selects those layers from the array.
compress_ratios = { key = "text_config.compress_ratios", array = true }

# config.json text_config.dspark_markov_rank: the Markov head's rank (model.py:1117).
markov_rank = { key = "text_config.dspark_markov_rank" }

# config.json text_config.dspark_noise_token_id: the draft slot's seed token. model.py:75
# reads it in ModelArgs; the shared plan carries it as a draft fact.
noise_token = { key = "text_config.dspark_noise_token_id" }

# config.json vision_config.max_image_tokens: the image processor's token budget. The shared
# vision geometry has no field for it, so the layout carries it as a tower fact.
vision_max_tokens = { key = "vision_config.max_image_tokens" }

# model.py:67-68: the producer's ModelArgs default, absent from the release's config.json.
# The plan carries the value the reference constructor uses.
gate_temp = { key = "text_config.gate_temp", default = 1.0 }

# config.json text_config.dspark_target_layer_ids: model.py:1113 sizes main_proj's input by the
# number of entries, not by a written count.
mtp_targets = { key = "text_config.dspark_target_layer_ids", length = true }

# config.json quantization_config.weight_block_size: the scale grid, read from the config rather
# than repeated as a literal in every scale shape.
quant_block = { key = "quantization_config.weight_block_size", array = true }

# Config keys the description decodes through this layout. A key the arm's typed parser reads
# and the shared description has no use for is listed ignorable with the reason.
[[keys]]
# config.json text_config.model_type: the nested producer type, matched here only.
path = "text_config.model_type"
ignore = "the nested producer type is matched by the root architectures/model_type this layout compares; the arm's typed parser reads it and the shared reader derives the family from the nested stack"

[[keys]]
# config.json text_config.num_key_value_heads: the released KV-head count. The run is MLA, but
# the shared attention description reads this field (it is the GQA-shaped fallback).
path = "text_config.num_key_value_heads"
fact = "language.attention.kv_heads"

[[keys]]
# config.json vision_config.model_type: the nested tower type, matched here only.
path = "vision_config.model_type"
ignore = "the nested tower type is matched by the root architectures/model_type this layout compares; the shared vision reader derives the tower from its structural keys"

[[keys]]
# config.json text_config.dspark_noise_token_id: the DSpark drafter's noise token. model.py:75
# reads it in ModelArgs; the shared checkpoint plan does not plan the DSpark sampler.
path = "text_config.dspark_noise_token_id"
ignore = "the arm typed DSpark parser owns this token id; the shared checkpoint plan does not run DSpark sampling"

[[keys]]
# config.json vision_config.max_image_tokens: the image processor's token budget. vision.py has
# no tensor shaped by it; the processor reads it, not the tensor plan.
path = "vision_config.max_image_tokens"
ignore = "the image processor token budget; no tensor or tensor-plan dimension derives from it"

[[keys]]
# config.json vision_config.max_wh_ratio: the processor's aspect cap. The released document
# stores null and no tensor shape derives from it.
path = "vision_config.max_wh_ratio"
ignore = "the image processor aspect cap (null in the released document); no tensor shape derives from it"

# Model keys this family ignores; each is a producer or training switch the arm's typed parser
# reads, never a shared shape fact.

[[keys]]
# config.json text_config.attention_dropout: the producer's training-time attention dropout; inference runs dropout off, and no tensor shape depends on it.
path = "text_config.attention_dropout"
ignore = "the producer's training-time attention dropout; inference runs dropout off, and no tensor shape depends on it"

[[keys]]
# config.json text_config.initializer_range: the producer's training-time weight initialization range; this family derives no inference geometry from it.
path = "text_config.initializer_range"
ignore = "the producer's training-time weight initialization range; this family derives no inference geometry from it"

[[keys]]
# config.json text_config.linear_attn_config.kda_layers: the KDA layer schedule, which
# layer_types also states (the parse refuses a disagreement).
path = "text_config.linear_attn_config.kda_layers"
fact = "language.linear_attention.kda_layers"

[[keys]]
# config.json text_config.linear_attn_config.full_attn_layers: the MLA layer schedule, likewise.
path = "text_config.linear_attn_config.full_attn_layers"
fact = "language.linear_attention.full_attn_layers"

[[keys]]
# config.json text_config.use_cache: a producer output switch for returning the KV cache; serving always keeps the cache.
path = "text_config.use_cache"
ignore = "a producer output switch for returning the KV cache; serving always keeps the cache"

[stacks.language]
order = [
  "rms_norm",
  "hyper_connection",
  "engram",
  "mla_attention",
  "gqa_attention",
  "gdn_scan",
  "kda_scan",
  "csa2_compression",
  "sparse_indexer",
  "moe",
]

[stacks.draft]
order = ["mtp"]

[stacks.vision]
order = [
  "vision_patch_embed",
  "vision_position",
  "vision_norm",
  "vision_attention",
  "vision_mlp",
  "vision_downsample",
  "vision_merger",
]

# inference/vision.py:180-184: the tower has an axial rotary embedding and no learned position
# table. The tensor index agrees: no position tensor is stored.
[[stacks.vision.parts]]
part = "vision_position"
[[stacks.vision.parts.facts]]
name = "position"
value = "rotary"

# inference/vision.py:28-36: RMSNorm with the constructor default epsilon 1e-6; the released
# vision_config states no rms_norm_eps and the index proves RMS by norm1/norm2 weights.
[[stacks.vision.parts]]
part = "vision_norm"
[[stacks.vision.parts.facts]]
name = "norm_epsilon"
value = 1e-6

# inference/vision.py:65-80: SwiGLU (w1 -> chunk, F.silu(gate) * up, w2); the released
# vision_config states no hidden_act.
[[stacks.vision.parts]]
part = "vision_mlp"
[[stacks.vision.parts.facts]]
name = "activation"
value = "silu"

# inference/vision.py:193-207: the Aligner is w2(F.gelu(w1(x))) with no final norm, and
# aligner.w1 in the index proves the 3x3 unfold downsample (vision.py:199-205).
[[stacks.vision.parts]]
part = "vision_merger"
[[stacks.vision.parts.facts]]
name = "merger_activation"
value = "gelu"
[[stacks.vision.parts.facts]]
name = "merger_final_norm"
value = false
[[stacks.vision.parts.facts]]
name = "downsample"
value = "unfold"

# The language stack's wiring that no config key states. inference/model.py:644 and 706: the
# attention keeps one latent, kv_norm(wkv(x)), which every head reads as its key and value;
# 1268: the head folds the streams through the last block's pre-mix, layer.hc_pre(h, pre_mix).
[[stacks.language.parts]]
part = "mla_attention"
[[stacks.language.parts.facts]]
name = "form"
value = "latent"

[[stacks.language.parts]]
part = "manifold_hyper_connection"
[[stacks.language.parts.facts]]
name = "head_fold"
value = "last_pre_mix"

# The language backbone. model.py:1204-1209 creates the final norm, model.py:1194-1203 the
# embedding and head; tie_word_embeddings is false in the released config.

[[tensor]]
name = "embed.weight"
part = "embedding"
role = "embedding"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "rows"

[[tensor]]
name = "norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"

[[tensor]]
name = "head.weight"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "rows"

# model.py:933-934: one RMSNorm before each branch.
[[tensor]]
name = "layers.{layer}.attn_norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "layers.{layer}.ffn_norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"
repeat = "layers"

# model.py:939-945: mHC coefficients. mix_hc = (2 + hc_mult) * hc_mult and hc_dim =
# hc_mult * dim; all six tensors are created inside set_dtype(torch.float32).
[[tensor]]
name = "layers.{layer}.hc_attn_fn"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = ["hyper_rows", "hyper_width"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "layers.{layer}.hc_attn_base"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = ["hyper_rows"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "layers.{layer}.hc_attn_scale"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = [3]
split = "whole"
repeat = "layers"

[[tensor]]
name = "layers.{layer}.hc_ffn_fn"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = ["hyper_rows", "hyper_width"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "layers.{layer}.hc_ffn_base"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = ["hyper_rows"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "layers.{layer}.hc_ffn_scale"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = [3]
split = "whole"
repeat = "layers"

# model.py:639-644: q/k RMSNorms and the per-head learned attention sink.
[[tensor]]
name = "layers.{layer}.attn.q_norm.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["q_lora"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.kv_norm.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["head_dim"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.attn_sink"
part = "mla_attention"
role = "attention"
dtype = "f32"
shape = ["heads"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

# model.py:763-787: the MLA projections. wq_a/wq_b produce the low-rank query, wkv the
# latent KV, wo_a/wo_b the grouped low-rank output; all five are dense FP8 with a 32x32 grid.
[[tensor]]
name = "layers.{layer}.attn.wq_a.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["q_lora", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wq_a.scale"
part = "mla_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(q_lora) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wq_b.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["heads * head_dim", "q_lora"]
split = "rows"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wq_b.scale"
part = "mla_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(heads * head_dim) / quant_block[0]", "(q_lora) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wkv.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wkv.scale"
part = "mla_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(head_dim) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wo_a.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["o_groups * o_lora", "heads * head_dim / o_groups"]
split = "rows"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wo_a.scale"
part = "mla_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(o_groups * o_lora) / quant_block[0]", "(heads * head_dim / o_groups) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wo_b.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["hidden", "o_groups * o_lora"]
split = "columns"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.wo_b.scale"
part = "mla_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(hidden) / quant_block[0]", "(o_groups * o_lora) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

# A grouped-query layer inside the MLA stack (text_config.layer_types names it gqa_attention, and
# text_config.gqa_attn_config holds its heads, key/value heads and head width): four projections
# in the dense class, no low-rank query, no latent and no sink. The query and key/value
# projections split by heads (the key/value rows by key/value heads, which a wider world shares)
# and the output projection by columns, the dense arm's grouped-query split.
[[tensor]]
name = "layers.{layer}.attn.wq.weight"
part = "gqa_attention"
role = "attention"
dtype = "dense"
shape = ["heads * head_dim", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wq.scale"
part = "gqa_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(heads * head_dim) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "rows"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wk.weight"
part = "gqa_attention"
role = "attention"
dtype = "dense"
shape = ["kv_heads * head_dim", "hidden"]
split = "kv_rows"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wk.scale"
part = "gqa_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(kv_heads * head_dim) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "kv_rows"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wv.weight"
part = "gqa_attention"
role = "attention"
dtype = "dense"
shape = ["kv_heads * head_dim", "hidden"]
split = "kv_rows"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wv.scale"
part = "gqa_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(kv_heads * head_dim) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "kv_rows"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wo.weight"
part = "gqa_attention"
role = "attention"
dtype = "dense"
shape = ["hidden", "heads * head_dim"]
split = "columns"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "layers.{layer}.attn.wo.scale"
part = "gqa_attention"
role = "attention"
dtype = "f8e8m0"
shape = ["(hidden) / quant_block[0]", "(heads * head_dim) / quant_block[0]"]
split = "columns"
repeat = "layers"
when = { attention = "gqa" }

# A Gated DeltaNet layer inside the MLA stack (text_config.layer_types names it linear_attention,
# and the Qwen3-Next linear_* keys hold its heads, widths and conv taps): the five projections in
# the dense class (the fused q/k/v rows, the output gate z, the beta and decay logits b and a,
# and the output), and the conv, the decay vectors and the gated norm BF16 as the Qwen3-Next
# release stores them. No cache, no sink and no compression: the layer keeps one recurrent state.
# Every tensor is stated whole: the base runs this block on every rank, every head, with no sum
# after it, and the plan reads the block's split from these statements.
[[tensor]]
name = "layers.{layer}.attn.in_proj_qkv.weight"
part = "gdn_scan"
role = "attention"
dtype = "dense"
shape = ["2 * gdn_key_width + gdn_value_width", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_qkv.scale"
part = "gdn_scan"
role = "attention"
dtype = "f8e8m0"
shape = ["(2 * gdn_key_width + gdn_value_width) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_z.weight"
part = "gdn_scan"
role = "attention"
dtype = "dense"
shape = ["gdn_value_width", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_z.scale"
part = "gdn_scan"
role = "attention"
dtype = "f8e8m0"
shape = ["(gdn_value_width) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_b.weight"
part = "gdn_scan"
role = "attention"
dtype = "dense"
shape = ["gdn_value_heads", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_b.scale"
part = "gdn_scan"
role = "attention"
dtype = "f8e8m0"
shape = ["(gdn_value_heads) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_a.weight"
part = "gdn_scan"
role = "attention"
dtype = "dense"
shape = ["gdn_value_heads", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.in_proj_a.scale"
part = "gdn_scan"
role = "attention"
dtype = "f8e8m0"
shape = ["(gdn_value_heads) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.out_proj.weight"
part = "gdn_scan"
role = "attention"
dtype = "dense"
shape = ["hidden", "gdn_value_width"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.out_proj.scale"
part = "gdn_scan"
role = "attention"
dtype = "f8e8m0"
shape = ["(hidden) / quant_block[0]", "(gdn_value_width) / quant_block[0]"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.conv1d.weight"
part = "gdn_scan"
role = "attention"
dtype = "bf16"
shape = ["2 * gdn_key_width + gdn_value_width", 1, "gdn_conv"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.A_log"
part = "gdn_scan"
role = "attention"
dtype = "bf16"
shape = ["gdn_value_heads"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.dt_bias"
part = "gdn_scan"
role = "attention"
dtype = "bf16"
shape = ["gdn_value_heads"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

[[tensor]]
name = "layers.{layer}.attn.norm.weight"
part = "gdn_scan"
role = "attention"
dtype = "bf16"
shape = ["gdn_value_dim"]
split = "whole"
repeat = "layers"
when = { attention = "gdn" }

# A Kimi Delta Attention layer inside the MLA stack (text_config.layer_types names it
# linear_attention and text_config.linear_attn_config holds its heads, head width, conv taps and
# gate bound, the GLM-5.3-Flash spelling): q, k and v [width, hidden] with their own convs
# [width, 1, taps], the low-rank forget (f_a, f_b) and output-gate (g_a, g_b) projections, the
# write strength b, A_log and dt_bias f32, the gated norm and o_proj, stored as GLM-5.3-Flash
# stores them. The block splits by heads: the per-head tensors by rows, the low-rank inputs
# f_a and g_a and the norm whole, and o_proj by columns, whose partial the base sums.
[[tensor]]
name = "layers.{layer}.attn.q_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.k_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.v_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.q_conv1d.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", 1, "kda_conv"]
split = "conv"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.k_conv1d.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", 1, "kda_conv"]
split = "conv"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.v_conv1d.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", 1, "kda_conv"]
split = "conv"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.f_a_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.f_b_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "kda_head_dim"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.g_a_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.g_b_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "kda_head_dim"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.b_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_heads", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.A_log"
part = "kda_scan"
role = "attention"
dtype = "f32"
shape = ["kda_heads"]
split = "vector"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.dt_bias"
part = "kda_scan"
role = "attention"
dtype = "f32"
shape = ["kda_width"]
split = "vector"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.o_norm.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_head_dim"]
split = "whole"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "layers.{layer}.attn.o_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["hidden", "kda_width"]
split = "columns"
repeat = "layers"
when = { attention = "kda" }

# model.py:798-809: the router matrix is BF16 (the index has no ffn.gate.scale) and its two
# f32 biases are [routed]; bias_vl exists because the checkpoint has a vision tower.
[[tensor]]
name = "layers.{layer}.ffn.gate.weight"
part = "moe"
role = "router"
dtype = "bf16"
shape = ["routed", "hidden"]
split = "whole"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.gate.bias"
part = "moe"
role = "router"
dtype = "f32"
shape = ["routed"]
split = "whole"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.gate.bias_vl"
part = "moe"
role = "router"
dtype = "f32"
shape = ["routed"]
split = "whole"
repeat = "layers"
when = { ffn = "moe" }

# model.py:886-903: the one shared expert is a dense FP8 set (w1/w3 [shared_width, hidden],
# w2 [hidden, shared_width]), not a routed expert.
[[tensor]]
name = "layers.{layer}.ffn.shared_experts.w1.weight"
part = "moe"
role = "shared_expert"
dtype = "dense"
shape = ["shared_width", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.shared_experts.w1.scale"
part = "moe"
role = "shared_expert"
dtype = "f8e8m0"
shape = ["(shared_width) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "rows"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.shared_experts.w2.weight"
part = "moe"
role = "shared_expert"
dtype = "dense"
shape = ["hidden", "shared_width"]
split = "columns"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.shared_experts.w2.scale"
part = "moe"
role = "shared_expert"
dtype = "f8e8m0"
shape = ["(hidden) / quant_block[0]", "(shared_width) / quant_block[0]"]
split = "columns"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.shared_experts.w3.weight"
part = "moe"
role = "shared_expert"
dtype = "dense"
shape = ["shared_width", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.shared_experts.w3.scale"
part = "moe"
role = "shared_expert"
dtype = "f8e8m0"
shape = ["(shared_width) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "rows"
repeat = "layers"
when = { ffn = "moe" }

# A dense-FFN layer (first_k_dense_replace): one gated MLP in the dense class, named like the
# shared expert one level up (w1/w3 [intermediate, hidden], w2 [hidden, intermediate]). The
# released checkpoint has none; the shared description plans it for a release that does.
[[tensor]]
name = "layers.{layer}.ffn.w1.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "dense"
shape = ["intermediate", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "layers.{layer}.ffn.w1.scale"
part = "dense_mlp"
role = "dense_mlp"
dtype = "f8e8m0"
shape = ["(intermediate) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "rows"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "layers.{layer}.ffn.w2.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "dense"
shape = ["hidden", "intermediate"]
split = "columns"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "layers.{layer}.ffn.w2.scale"
part = "dense_mlp"
role = "dense_mlp"
dtype = "f8e8m0"
shape = ["(hidden) / quant_block[0]", "(intermediate) / quant_block[0]"]
split = "columns"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "layers.{layer}.ffn.w3.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "dense"
shape = ["intermediate", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "layers.{layer}.ffn.w3.scale"
part = "dense_mlp"
role = "dense_mlp"
dtype = "f8e8m0"
shape = ["(intermediate) / quant_block[0]", "(hidden) / quant_block[0]"]
split = "rows"
repeat = "layers"
when = { ffn = "dense" }

# model.py:860-903: routed experts. The index stores w1/w3 as [inter, hidden/2] int8 FP4
# and w2 as [hidden, inter/2]; the arithmetic shapes are [inter, hidden] and [hidden, inter].
# The scale grid is one value per output row per 32 along K (dtype.rs). TP4 splits the
# intermediate width: w1/w3 on their output rows, w2 on its input columns.
[[tensor]]
name = "layers.{layer}.ffn.experts.{expert}.w1.weight"
part = "moe"
role = "experts"
dtype = "f4e2m1"
shape = ["moe_intermediate", "hidden"]
split = "rows"
repeat = "experts"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.experts.{expert}.w1.scale"
part = "moe"
role = "experts"
dtype = "f8e8m0"
shape = ["moe_intermediate", "hidden / quant_block[0]"]
split = "rows"
repeat = "experts"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.experts.{expert}.w2.weight"
part = "moe"
role = "experts"
dtype = "f4e2m1"
shape = ["hidden", "moe_intermediate"]
split = "columns"
repeat = "experts"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.experts.{expert}.w2.scale"
part = "moe"
role = "experts"
dtype = "f8e8m0"
shape = ["hidden", "moe_intermediate / quant_block[0]"]
split = "columns"
repeat = "experts"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.experts.{expert}.w3.weight"
part = "moe"
role = "experts"
dtype = "f4e2m1"
shape = ["moe_intermediate", "hidden"]
split = "rows"
repeat = "experts"
when = { ffn = "moe" }

[[tensor]]
name = "layers.{layer}.ffn.experts.{expert}.w3.scale"
part = "moe"
role = "experts"
dtype = "f8e8m0"
shape = ["moe_intermediate", "hidden / quant_block[0]"]
split = "rows"
repeat = "experts"
when = { ffn = "moe" }

# model.py:429-470 and config kv_source_layer_ids: the layers that own a compressed KV. The
# listed repeat walks the config array, so no name carries a literal layer number.
[[tensor]]
name = "layers.{layer}.attn.compressor.wkv.weight"
part = "csa2_compression"
role = "attention"
dtype = "bf16"
shape = ["head_dim", "hidden"]
split = "whole"
repeat = "listed_layers"
layers = "kv_source_ids"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.compressor.norm.weight"
part = "csa2_compression"
role = "attention"
dtype = "bf16"
shape = ["head_dim"]
split = "whole"
repeat = "listed_layers"
layers = "kv_source_ids"
when = { attention = "mla" }

# compressor.wgate exists only where compress_ratios[layer] > 1, so the array threshold
# selects the gated layers from the same config array that states the ratios.
[[tensor]]
name = "layers.{layer}.attn.compressor.wgate.weight"
part = "csa2_compression"
role = "attention"
dtype = "bf16"
shape = ["head_dim", "hidden"]
split = "whole"
repeat = "listed_layers"
layers = "kv_source_ids"
when = { attention = "mla", array = "compress_ratios", gt = 1 }

# model.py:488-530 and config index_source_layer_ids: the indexer layers. The listed repeat
# walks the config array. Only a layer that owns the compressed KV publishes its own index
# keys (wk/k_norm), so that pair walks kv_source_layer_ids (tensor.rs push_indexer).
[[tensor]]
name = "layers.{layer}.attn.indexer.wq_b.weight"
part = "sparse_indexer"
role = "indexer"
dtype = "dense"
shape = ["index_heads * index_dim", "q_lora"]
split = "whole"
repeat = "listed_layers"
layers = "index_source_ids"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.indexer.wq_b.scale"
part = "sparse_indexer"
role = "indexer"
dtype = "f8e8m0"
shape = ["(index_heads * index_dim) / quant_block[0]", "q_lora / quant_block[0]"]
split = "whole"
repeat = "listed_layers"
layers = "index_source_ids"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.indexer.weights_proj.weight"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_heads", "hidden"]
split = "whole"
repeat = "listed_layers"
layers = "index_source_ids"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.indexer.wk.weight"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_dim", "head_dim"]
split = "whole"
repeat = "listed_layers"
layers = "kv_source_ids"
when = { attention = "mla" }

[[tensor]]
name = "layers.{layer}.attn.indexer.k_norm.weight"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_dim"]
split = "whole"
repeat = "listed_layers"
layers = "kv_source_ids"
when = { attention = "mla" }

# model.py:328-356 and config engram_layer_ids: the Engram layers. The rows are
# engram_num_embeddings[list] for the same position in engram_layer_ids; the fetched width is
# (engram_max_ngram_size - 1) * engram_n_heads * engram_head_dim (model.py:344-345).
# The ops vocabulary has no Engram tensor role yet, so the table uses ple_table and the
# projections use ple_aux; the part is engram.
[[tensor]]
name = "layers.{layer}.engram.embed.weight"
part = "engram"
role = "ple_table"
dtype = "f8e4m3"
shape = ["engram_rows[list]", "engram_head_dim"]
split = "whole"
repeat = "listed_layers"
layers = "engram_ids"
when = { side = "engram" }

[[tensor]]
name = "layers.{layer}.engram.embed.scale"
part = "engram"
role = "ple_table"
dtype = "f8e8m0"
shape = ["engram_rows[list]", "engram_head_dim / quant_block[0]"]
split = "whole"
repeat = "listed_layers"
layers = "engram_ids"
when = { side = "engram" }

[[tensor]]
name = "layers.{layer}.engram.wkv.weight"
part = "engram"
role = "ple_aux"
dtype = "f8e4m3"
shape = ["hidden * (streams + 1)", "(engram_ngram - 1) * engram_heads * engram_head_dim"]
split = "whole"
repeat = "listed_layers"
layers = "engram_ids"
when = { side = "engram" }

[[tensor]]
name = "layers.{layer}.engram.wkv.scale"
part = "engram"
role = "ple_aux"
dtype = "f8e8m0"
shape = ["(hidden * (streams + 1)) / quant_block[0]", "((engram_ngram - 1) * engram_heads * engram_head_dim) / quant_block[0]"]
split = "whole"
repeat = "listed_layers"
layers = "engram_ids"
when = { side = "engram" }

[[tensor]]
name = "layers.{layer}.engram.q_weight"
part = "engram"
role = "ple_aux"
dtype = "bf16"
shape = ["streams", "hidden"]
split = "whole"
repeat = "listed_layers"
layers = "engram_ids"
when = { side = "engram" }

[[tensor]]
name = "layers.{layer}.engram.k_weight"
part = "engram"
role = "ple_aux"
dtype = "bf16"
shape = ["streams", "hidden"]
split = "whole"
repeat = "listed_layers"
layers = "engram_ids"
when = { side = "engram" }

