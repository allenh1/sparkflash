# Dory1.0-4B-BF16 layout.
#
# Sources, in the layout spec order:
#   * config.json states the sizes and scores; each key read or carried here names it.
#   * the released checkpoint's safetensors header states every tensor name and stored
#     shape. It has 507 tensors and one 7.95 GB BF16 shard.
#   * crates/sparkflash-model-dory/src/tensor.rs:65-181 (DoryTensorPlan::served) is the
#     arm's own plan for the same 507 names and shapes; its Role spelling is the source
#     for each tensor's role below. The arm runs the model correctly today.
#   * crates/sparkflash-model-dory/src/config.rs:267-455 derives the 36-block / 72-sublayer
#     loop schedule from n_input_layers, n_recurrent_layers, n_output_layers and
#     n_recurrent_loops.
#
# Format gaps recorded with the lead, not worked around in Rust:
#   1. The reader's repeat = "layers" iterates the 36 collapsed blocks, but this
#      checkpoint stores 72 sublayers: attention at even indices and MLP at odd ones.
#      A name template has only {layer}/{block}/{expert}, with no offset or stride, so
#      the 504 backbone tensors are named explicitly below. The smallest TOML that
#      would express it is a name expression, for example
#        name = "backbone.layers.{2 * layer}.mixer.q_proj.weight"
#      with repeat = "layers"; the reader refuses the unexpanded placeholder today.
# The [vars] section below supplies the width facts an explicit repeat = "once" tensor
# cannot take from a layer: the checkpoint stores 72 sublayers while the shared walk has
# 36 blocks, so each tensor is named once and its width is a config fact, never a
# repeated literal.

schema = 1
id = "dory1-4b-bf16"

[match]
architectures = ["DoryForCausalLM"]
model_types = ["dory"]

# The four keys the shared parser leaves for the arm. The first two are arithmetic the arm
# applies (the nGPT residual scale and the bias switch); the rope types are the per-kind
# selectors. They are carried as facts; this reader does not apply them yet. They are
# named in the PR report; the scan has no unknown-layout row for them because every row
# they could affect is already resolved.
[[keys]]
# config.json mlp_bias: false; tensor.rs:65-181 stores no MLP projection bias.
path = "mlp_bias"
fact = "language.mlp_bias"

[[keys]]
# config.json ngpt_alpha_init: 0.05; config.rs:alpha_scale divides it by
# initializer_range for every sublayer residual interpolation.
path = "ngpt_alpha_init"
fact = "language.ngpt.alpha_init"

[[keys]]
# config.json rope_parameters.sliding_attention.rope_type: "default".
path = "rope_parameters.sliding_attention.rope_type"
fact = "language.attention.sliding_rope_type"

[[keys]]
# config.json rope_parameters.full_attention.rope_type: "default".
path = "rope_parameters.full_attention.rope_type"
fact = "language.attention.full_rope_type"

[[keys]]
# config.json initializer_range: config.rs:610-637 divides the nGPT residual alpha, the q/k
# scale, the output-gate scale and the LM-head logit scale by it, so it is arithmetic the arm
# applies even though no shared tensor shape uses it.
path = "initializer_range"
fact = "language.initializer_range"

# Shape facts for the explicit tensor names. Each is the config key the arm reads: the
# query width is num_attention_heads * head_dim, the KV width is
# num_key_value_heads * head_dim, and the MLP width is intermediate_size
# (crates/sparkflash-model-dory/src/tensor.rs:70-73).
[vars]
heads = { key = "num_attention_heads" }
head_dim = { key = "head_dim" }
kv_heads = { key = "num_key_value_heads" }
intermediate = { key = "intermediate_size" }

# The part vocabulary in forward order. The shared architecture already collapses each
# attention/MLP pair to one block; the order is the walk the arm runs
# (crates/sparkflash-model-dory/src/backend.rs).
[stacks.language]
order = ["embedding", "rms_norm", "gqa_attention", "dense_mlp", "lm_head"]

# Global tensors. Names and shapes: safetensors header; roles: tensor.rs:73-79 and
# tensor.rs:170-181.
[[tensor]]
name = "backbone.embeddings.weight"
part = "embedding"
role = "embedding"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "whole"

[[tensor]]
name = "lm_head.weight"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "whole"

[[tensor]]
name = "lm_head.logit_scale"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab"]
split = "whole"

# The 72 stored sublayers. Each integer below is a stored name index, not a dimension;
# the shapes are the header's stored shapes, and tensor.rs:80-168 lists the same names
# and shapes from the configuration. Split = whole because a Dory recurrence rank holds
# whole tensors: crates/sparkflash-model-dory/src/recurrence.rs:17-23 says the group is
# not tensor parallelism and no rank holds a slice of a layer.

# Stored sublayer 0: the attention sublayer of block 0 (config.json
