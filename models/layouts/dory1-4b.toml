# Dory1.0-4B-BF16 layout.
#
# Sources, in the layout spec order:
#   * config.json states the sizes and switches. [vars] names the keys that size a tensor;
#     each [[keys]] entry names a key carried as a fact or ignored for a written reason.
#   * the released checkpoint's safetensors header states every tensor name and stored shape.
#   * crates/sparkflash-model-dory/src/tensor.rs:65-181 (DoryTensorPlan::served) is the arm's
#     own plan for the same names and shapes; its Role spelling is the source for the roles
#     below. The arm runs the model correctly today.
#   * crates/sparkflash-model-dory/src/config.rs:267-455 derives the loop schedule from the
#     input, recurrent and output sublayer counts and the recurrent loop count.
#
# Dory stores each transformer block as an attention sublayer followed by an MLP sublayer;
# the shared walk collapses the pair into one block. The name expressions below map the
# shared block index to its stored pair: attention at 2 * layer, MLP at 2 * layer + 1. The
# head counts and widths are config facts, never repeated numbers.

schema = 1
id = "dory1-4b-bf16"

[match]
architectures = ["DoryForCausalLM"]
model_types = ["dory"]

# Config keys the description does not model as typed fields. Each is carried as a fact the
# scan prints; none of them is guessed.
[[keys]]
# config.json mlp_bias: false; tensor.rs:65-181 stores no MLP projection bias.
path = "mlp_bias"
fact = "language.mlp_bias"

[[keys]]
# config.json ngpt_alpha_init: config.rs:alpha_scale divides it by initializer_range for
# every sublayer residual interpolation.
path = "ngpt_alpha_init"
fact = "language.ngpt.alpha_init"

[[keys]]
# config.json rope_parameters.sliding_attention.rope_type: "default".
path = "rope_parameters.sliding_attention.rope_type"
fact = "language.attention.sliding_rope_type"

[[keys]]
# config.json rope_parameters.full_attention.rope_type: "default".
path = "rope_parameters.full_attention.rope_type"
fact = "language.attention.full_rope_type"

[[keys]]
# config.json initializer_range: config.rs:610-637 divides the nGPT residual alpha, the q/k
# scale, the output-gate scale and the LM-head logit scale by it, so it is arithmetic the arm
# applies even though no shared tensor shape uses it.
path = "initializer_range"
fact = "language.initializer_range"

# Shape facts. Each is the config key the arm reads: the query width is
# num_attention_heads * head_dim, the KV width is num_key_value_heads * head_dim, and the MLP
# width is intermediate_size (crates/sparkflash-model-dory/src/tensor.rs:70-73).
[vars]
heads = { key = "num_attention_heads" }
head_dim = { key = "head_dim" }
kv_heads = { key = "num_key_value_heads" }
intermediate = { key = "intermediate_size" }

# The part vocabulary in forward order. The shared architecture already collapses each
# attention/MLP pair to one block; the order is the walk the arm runs
# (crates/sparkflash-model-dory/src/backend.rs).
[stacks.language]
order = ["embedding", "rms_norm", "gqa_attention", "dense_mlp", "lm_head"]

# Global tensors. Names and shapes: safetensors header; roles: tensor.rs:73-79 and
# tensor.rs:170-181.
[[tensor]]
name = "backbone.embeddings.weight"
part = "embedding"
role = "embedding"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "whole"

[[tensor]]
name = "lm_head.weight"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "whole"

[[tensor]]
name = "lm_head.logit_scale"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab"]
split = "whole"

# The attention sublayer of each stored block. Names and shapes: safetensors header;
# tensor.rs:119-167. Split = whole because a Dory recurrence rank holds whole tensors:
# crates/sparkflash-model-dory/src/recurrence.rs:17-23 says the group is not tensor
# parallelism and no rank holds a slice of a layer.
[[tensor]]
name = "backbone.layers.{2 * layer}.attn_alpha"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.q_proj.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.k_proj.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["kv_heads * head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.v_proj.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["kv_heads * head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.g_proj.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.o_proj.weight"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["hidden", "heads * head_dim"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.sqk"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * head_dim"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

[[tensor]]
name = "backbone.layers.{2 * layer}.mixer.s_gate"
part = "gqa_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * head_dim"]
split = "whole"
repeat = "layers"
when = { attention = "gqa" }

# The MLP sublayer of each stored block. Names and shapes: safetensors header;
# tensor.rs:82-118. Split = whole for the same recurrence reason as the attention block.
[[tensor]]
name = "backbone.layers.{2 * layer + 1}.mlp_alpha"
part = "dense_mlp"
role = "dense_mlp"
dtype = "bf16"
shape = ["hidden"]
split = "whole"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "backbone.layers.{2 * layer + 1}.mixer.gate_proj.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "bf16"
shape = ["intermediate", "hidden"]
split = "whole"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "backbone.layers.{2 * layer + 1}.mixer.up_proj.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "bf16"
shape = ["intermediate", "hidden"]
split = "whole"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "backbone.layers.{2 * layer + 1}.mixer.down_proj.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "bf16"
shape = ["hidden", "intermediate"]
split = "whole"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "backbone.layers.{2 * layer + 1}.mixer.suv_gate"
part = "dense_mlp"
role = "dense_mlp"
dtype = "bf16"
shape = ["intermediate"]
split = "whole"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "backbone.layers.{2 * layer + 1}.mixer.suv_up"
part = "dense_mlp"
role = "dense_mlp"
dtype = "bf16"
shape = ["intermediate"]
split = "whole"
repeat = "layers"
when = { ffn = "dense" }
