[[tensor]]
name = "model.language_model.layers.{layer}.mlp.shared_experts.gate_proj.weight"
part = "moe"
role = "shared_expert"
dtype = "dense"
shape = ["shared_width", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "model.language_model.layers.{layer}.mlp.shared_experts.up_proj.weight"
part = "moe"
role = "shared_expert"
dtype = "dense"
shape = ["shared_width", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "model.language_model.layers.{layer}.mlp.shared_experts.down_proj.weight"
part = "moe"
role = "shared_expert"
dtype = "dense"
shape = ["hidden", "shared_width"]
split = "columns"
repeat = "layers"
when = { ffn = "moe" }

[[tensor]]
name = "model.language_model.layers.{layer}.mlp.experts.{expert}.gate_proj.weight"
part = "moe"
role = "experts"
dtype = "expert"
shape = ["moe_intermediate", "hidden"]
split = "expert_rows"
repeat = "experts"
when = { ffn = "moe" }

[[tensor]]
