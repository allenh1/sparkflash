when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_a_proj_with_mqa.weight"
slot = "layers.{layer}.attn.wkv.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["kv_lora", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_a_proj_with_mqa.weight"
slot = "mtp.{stage}.attn.wkv.weight"
part = "mla_attention"
role = "mtp"
dtype = "dense"
shape = ["kv_lora", "hidden"]
split = "whole"
repeat = "mtp"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_a_layernorm.weight"
slot = "layers.{layer}.attn.kv_norm.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["kv_lora"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_a_layernorm.weight"
slot = "mtp.{stage}.attn.kv_norm.weight"
part = "mla_attention"
role = "mtp"
dtype = "bf16"
shape = ["kv_lora"]
split = "whole"
repeat = "mtp"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_b_proj.weight"
slot = "layers.{layer}.attn.wkv_b.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * (nope + v_head)", "kv_lora"]
split = "rows"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_b_proj.weight"
