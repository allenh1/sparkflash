[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_b_proj.weight"
slot = "mtp.{stage}.attn.wq_b.weight"
part = "mla_attention"
role = "mtp"
dtype = "dense"
shape = ["heads * nope", "q_lora"]
split = "rows"
