part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_heads", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla", indexer = true }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.indexer.index_kpool_compress_gate"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla", indexer = true }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.indexer.index_kpool_compress_ape"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_pool", "index_dim"]
split = "whole"
repeat = "layers"
when = { attention = "mla", indexer = true }

# Dense and routed feed-forward blocks.
[[tensor]]
name = "model.language_model.layers.{layer}.mlp.gate_proj.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "dense"
shape = ["intermediate", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "model.language_model.layers.{layer}.mlp.up_proj.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "dense"
shape = ["intermediate", "hidden"]
split = "rows"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "model.language_model.layers.{layer}.mlp.down_proj.weight"
part = "dense_mlp"
role = "dense_mlp"
dtype = "dense"
shape = ["hidden", "intermediate"]
split = "columns"
repeat = "layers"
when = { ffn = "dense" }

[[tensor]]
name = "model.language_model.layers.{layer}.mlp.gate.weight"
part = "moe"
role = "router"
dtype = "bf16"
