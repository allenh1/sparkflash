repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_b_proj.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["heads * nope", "q_lora"]
split = "rows"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_a_proj_with_mqa.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["kv_lora", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_a_layernorm.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["kv_lora"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.kv_b_proj.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["heads * (nope + v_head)", "kv_lora"]
split = "rows"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.o_proj.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["hidden", "heads * v_head"]
split = "columns"
repeat = "layers"
when = { attention = "mla" }

# The sparse indexer (modeling line 1958-2082).
[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.indexer.wq_b.weight"
