split = "whole"
repeat = "layers"
when = { attention = "mla", indexer = true }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.indexer.wk.weight"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla", indexer = true }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.indexer.k_norm.weight"
part = "sparse_indexer"
role = "indexer"
dtype = "bf16"
shape = ["index_dim"]
split = "whole"
repeat = "layers"
when = { attention = "mla", indexer = true }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.indexer.k_norm.bias"
part = "sparse_indexer"
