# GLM-5.3-Flash layout.
#
# Wiring sources, in the order the layout spec gives them:
#   * the checkpoint's own config.json (a config key is named beside the fact it sets);
#   * the tensor index (a tensor name proves the component and its shape);
#   * the producer reference for what neither states:
#     transformers/models/glm5_next/modeling_glm5_next.py at transformers commit
#     42efcfde46e668067a74bbd439d33f107b4a7c6c. The checkpoint (revision
#     3f1971b7b5f7a528c9c4ef6212c8785298a8c24a) ships no modelling code and names
#     transformers_version 5.16.0; this is the producer implementation available for that
#     model type.
#     The vision tower is Glm5NextVisionModel (line 1809), whose blocks are RMSNorm
#     (1698-1715), the attention has q/k RMSNorm and axial rotary (1610-1695), the patch
#     embed is a 3-D convolution over temporal_patch_size frames (1728-1745), and the
#     merger is proj -> LayerNorm -> GELU -> gated SwiGLU (1545-1570).
#
# Every shape below is an expression over facts the reader takes from the config or the
# architecture; no dimension is repeated as a number.

schema = 1
id = "glm5-next-fp8"

[match]
architectures = ["Glm5NextForConditionalGeneration"]
model_types = ["glm5_next"]

# Config keys the description decodes through this layout. A key that only names the
# producer's own type is still read here so the config-key check can account for it.
[[keys]]
# config.json text_config.qk_head_dim: the MLA query/key width (head_dim is 0).
path = "text_config.qk_head_dim"
fact = "language.attention.head_dim"

[[keys]]
# config.json text_config.mla_use_nope: the NoPE MLA scheme (qk_rope_head_dim is 0).
path = "text_config.mla_use_nope"
fact = "language.attention.rope"

[[keys]]
# config.json text_config.num_key_value_heads: the producer's KV-head count.
path = "text_config.num_key_value_heads"
fact = "language.attention.kv_heads"

[[keys]]
# config.json text_config.moe_router_dtype: the router accumulator width.
path = "text_config.moe_router_dtype"
fact = "language.moe.router_dtype"

[[keys]]
# config.json text_config.index_kpool_compress: the indexer's pooled stage.
path = "text_config.index_kpool_compress"
fact = "language.indexer.pool_compress"

[[keys]]
# config.json text_config.index_share_for_mtp_iteration: the MTP indexer's selection.
path = "text_config.index_share_for_mtp_iteration"
fact = "language.draft.indexer_shared"

[[keys]]
# config.json text_config.indexer_rope_interleave: the indexer's rotary layout.
path = "text_config.indexer_rope_interleave"
fact = "language.indexer.rope_interleave"

[[keys]]
# config.json text_config.linear_attn_config.kda_layers: the KDA layer schedule.
path = "text_config.linear_attn_config.kda_layers"
fact = "language.linear_attention.kda_layers"

[[keys]]
# config.json text_config.linear_attn_config.full_attn_layers: the sparse-MLA layer schedule.
path = "text_config.linear_attn_config.full_attn_layers"
fact = "language.linear_attention.full_attn_layers"

[[keys]]
# config.json text_config.model_type: the nested producer type, matched here only.
path = "text_config.model_type"
ignore = "the nested producer type is matched by the root architectures/model_type this layout compares; the arm's typed parser reads it and the shared reader derives the family from the nested stack"

[[keys]]
# config.json tie_word_embeddings: whether the head shares the embedding.
path = "tie_word_embeddings"
fact = "language.tie_word_embeddings"

[[keys]]
# config.json vision_config.image_size: the processor's image side.
path = "vision_config.image_size"
fact = "vision.image_size"

[[keys]]
# config.json vision_config.model_type: the nested tower type, matched here only.
path = "vision_config.model_type"
ignore = "the nested tower type is matched by the root architectures/model_type this layout compares; the shared vision reader derives the tower from its structural keys"

# The quantizer's exclusion list names modules the producer kept out of its FP8 pass.
# The tensor index is the authority on what was stored: each tensor's dtype below is read
# from that index, so repeating the producer's list here would be a second, weaker copy.
[[keys]]
path = "quantization_config.modules_to_not_convert"
ignore = "the producer's quantizer exclusion list; the tensor index states every stored dtype"

# Model keys this family ignores; each is a producer or training switch the arm's typed parser
# reads, never a shared shape fact.

[[keys]]
# config.json text_config.attention_dropout: the producer's training-time attention dropout; inference runs dropout off, and no tensor shape depends on it.
path = "text_config.attention_dropout"
ignore = "the producer's training-time attention dropout; inference runs dropout off, and no tensor shape depends on it"

[[keys]]
# config.json text_config.initializer_range: the producer's training-time weight initialization range; this family derives no inference geometry from it.
path = "text_config.initializer_range"
ignore = "the producer's training-time weight initialization range; this family derives no inference geometry from it"

[[keys]]
# config.json text_config.output_router_logits: a debug output switch on the producer's forward; serving returns logits, not router logits.
path = "text_config.output_router_logits"
ignore = "a debug output switch on the producer's forward; serving returns logits, not router logits"

[[keys]]
# config.json text_config.router_aux_loss_coef: the producer's training-time load-balancing loss coefficient; inference computes no loss.
path = "text_config.router_aux_loss_coef"
ignore = "the producer's training-time load-balancing loss coefficient; inference computes no loss"

[[keys]]
# config.json text_config.use_cache: a producer output switch for returning the KV cache; serving always keeps the cache.
path = "text_config.use_cache"
ignore = "a producer output switch for returning the KV cache; serving always keeps the cache"

[[keys]]
# config.json vision_config.attention_dropout: the producer's training-time attention dropout; inference runs dropout off, and no tensor shape depends on it.
path = "vision_config.attention_dropout"
ignore = "the producer's training-time attention dropout; inference runs dropout off, and no tensor shape depends on it"

[[keys]]
# config.json vision_config.initializer_range: the producer's training-time weight initialization range; this family derives no inference geometry from it.
path = "vision_config.initializer_range"
ignore = "the producer's training-time weight initialization range; this family derives no inference geometry from it"

[stacks.language]
order = [
  "rms_norm",
  "hyper_connection",
  "kda_scan",
  "mla_attention",
  "sparse_indexer",
  "dense_mlp",
  "moe",
]

[stacks.draft]
order = [
  "rms_norm",
  "mla_attention",
  "sparse_indexer",
  "moe",
  "mtp",
]

[stacks.vision]
order = [
  "vision_patch_embed",
  "vision_position",
  "vision_norm",
  "vision_attention",
  "vision_mlp",
  "vision_downsample",
  "vision_merger",
]

# modeling_glm5_next.py:1824 and 1865: the tower has an axial rotary embedding and no
# learned position table. The tensor index agrees: no position tensor is stored.
[[stacks.vision.parts]]
part = "vision_position"
[[stacks.vision.parts.facts]]
name = "position"
value = "rotary"
# The tower's wiring, each from the producer reference. modeling_glm5_next.py:1568-1583 is an
# RMSNorm (mean square in f32, the normalised value cast back before the weight) at the vision
# config's rms_norm_eps; 1698-1725 are the blocks, whose qkv and proj carry biases and whose
# attention normalises q and k per head (1623-1624); 1525-1542 is the gated MLP at the config's
# swiglu_limit; 1832-1837 is a stride-2 2 x 2 convolution from the ViT width to the output width,
# and 1545-1565 the merger: proj, a LayerNorm, GELU, then a clamped gated SwiGLU.
[[stacks.vision.parts]]
part = "vision_norm"
[[stacks.vision.parts.facts]]
name = "norm"
value = "rms"
[[stacks.vision.parts.facts]]
name = "norm_epsilon"
value = { key = "vision_config.rms_norm_eps" }

[[stacks.vision.parts]]
part = "vision_attention"
[[stacks.vision.parts.facts]]
name = "attention_bias"
value = true
[[stacks.vision.parts.facts]]
name = "qk_norm"
value = true

[[stacks.vision.parts]]
part = "vision_mlp"
[[stacks.vision.parts.facts]]
name = "activation"
value = "swiglu"

[[stacks.vision.parts]]
part = "vision_merger"
[[stacks.vision.parts.facts]]
name = "downsample"
value = "conv"
[[stacks.vision.parts.facts]]
name = "merger_activation"
value = "swiglu"
[[stacks.vision.parts.facts]]
name = "merger_final_norm"
value = false

# The language stack's wiring that no config key states, each from the producer reference.
# The stream and every module output take the config's dtype; the producer casts to f32 only
# where a fact below says so, and the base computes in no wider and no narrower type.
#
# modeling_glm5_next.py:74-79: the RMSNorm takes its mean square in f32 and casts the
# normalised value back to the input dtype before the weight.
[[stacks.language.parts]]
part = "rms_norm"
[[stacks.language.parts.facts]]
name = "accumulate"
value = "f32"

# modeling_glm5_next.py:300-303: the flattened streams are widened to f32, normed with the
# weightless norm (215, at rms_norm_eps) and mixed by the BF16 weight widened to f32, with no
# activation quantiser on the input; 304-324: the coefficients and the Sinkhorn stay f32;
# 1336-1346: post and comb are cast to the stream dtype before the stream update; 336 and
# 1510: the head folds the streams by their unweighted mean; 295, 1297 and 1324: each sublayer
# collapses the streams with the pre-mix its own connection just computed.
[[stacks.language.parts]]
part = "manifold_hyper_connection"
[[stacks.language.parts.facts]]
name = "collapse"
value = "own_mix"
[[stacks.language.parts.facts]]
name = "mix_input"
value = "f32"
[[stacks.language.parts.facts]]
name = "coefficients"
value = "f32"
[[stacks.language.parts.facts]]
name = "stream_update"
value = { key = "text_config.dtype" }
[[stacks.language.parts.facts]]
name = "head_fold"
value = "mean"

# modeling_glm5_next.py: the sparse layers are the V3 form, q_a/q_b, kv_a_proj_with_mqa and
# kv_b with a plain o_proj (the tensor index below proves each), absorbed through kv_b; 1093:
# the softmax runs in f32 and its probabilities are cast back to the query's dtype.
[[stacks.language.parts]]
part = "mla_attention"
[[stacks.language.parts.facts]]
name = "form"
value = "absorbed"
[[stacks.language.parts.facts]]
name = "softmax"
value = "f32"
[[stacks.language.parts.facts]]
name = "probabilities"
value = "query"

# modeling_glm5_next.py:862 and 866: the pooled scores and the head weights are f32; 999: the
# pool's gate-plus-position logits take their softmax in f32; 800: the index keys' LayerNorm
# (weight and bias) is built at eps 1e-6, which no config key states.
[[stacks.language.parts]]
part = "sparse_indexer"
[[stacks.language.parts.facts]]
name = "scores"
value = "f32"
[[stacks.language.parts.facts]]
name = "pool_softmax"
value = "f32"
[[stacks.language.parts.facts]]
name = "key_norm_eps"
value = 1e-6

# modeling_glm5_next.py:357-358: the forget gate and decay are f32; 476 and 533: the chunked
# and recurrent forms run in f32; 763: the recurrent state is stored f32; 385-391: the gated
# output norm is strict f32, weight and gate included.
[[stacks.language.parts]]
part = "kda_scan"
[[stacks.language.parts.facts]]
name = "decay"
value = "f32"
[[stacks.language.parts.facts]]
name = "recurrence"
value = "f32"
[[stacks.language.parts.facts]]
name = "state"
value = "f32"
[[stacks.language.parts.facts]]
name = "output_norm"
value = "f32"

# The language backbone.
[[tensor]]
name = "model.language_model.embed_tokens.weight"
slot = "embed.weight"
part = "embedding"
role = "embedding"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "whole"

[[tensor]]
name = "model.language_model.norm.weight"
slot = "norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"

[[tensor]]
name = "lm_head.weight"
slot = "head.weight"
part = "lm_head"
role = "lm_head"
dtype = "bf16"
shape = ["vocab", "hidden"]
split = "rows"

[[tensor]]
name = "model.language_model.layers.{layer}.input_layernorm.weight"
slot = "layers.{layer}.attn_norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "model.language_model.layers.{layer}.post_attention_layernorm.weight"
slot = "layers.{layer}.ffn_norm.weight"
part = "rms_norm"
role = "norm"
dtype = "bf16"
shape = ["hidden"]
split = "whole"
repeat = "layers"

# Hyper-connections: hc_{attn,ffn}_fn is [(2 + streams) * streams, streams * hidden], its
# base is one row per mixer, and its scale is three f32 entries (modeling line 1436).
[[tensor]]
name = "model.language_model.layers.{layer}.hc_attn_fn"
slot = "layers.{layer}.hc_attn_fn"
part = "hyper_connection"
role = "hyper"
dtype = "bf16"
shape = ["hyper_rows", "hyper_width"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "model.language_model.layers.{layer}.hc_attn_base"
slot = "layers.{layer}.hc_attn_base"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = ["hyper_rows"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "model.language_model.layers.{layer}.hc_attn_scale"
slot = "layers.{layer}.hc_attn_scale"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = [3]
split = "whole"
repeat = "layers"

[[tensor]]
name = "model.language_model.layers.{layer}.hc_ffn_fn"
slot = "layers.{layer}.hc_ffn_fn"
part = "hyper_connection"
role = "hyper"
dtype = "bf16"
shape = ["hyper_rows", "hyper_width"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "model.language_model.layers.{layer}.hc_ffn_base"
slot = "layers.{layer}.hc_ffn_base"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = ["hyper_rows"]
split = "whole"
repeat = "layers"

[[tensor]]
name = "model.language_model.layers.{layer}.hc_ffn_scale"
slot = "layers.{layer}.hc_ffn_scale"
part = "hyper_connection"
role = "hyper"
dtype = "f32"
shape = [3]
split = "whole"
repeat = "layers"

# Kimi Delta Attention (linear_attention layers). The projections are [width, hidden], the
# convolution is [width, 1, taps], and the two gate projections are low-rank.
[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_proj.weight"
slot = "layers.{layer}.attn.q_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.k_proj.weight"
slot = "layers.{layer}.attn.k_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.v_proj.weight"
slot = "layers.{layer}.attn.v_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_conv1d.weight"
slot = "layers.{layer}.attn.q_conv1d.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", 1, "kda_conv"]
split = "conv"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.k_conv1d.weight"
slot = "layers.{layer}.attn.k_conv1d.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", 1, "kda_conv"]
split = "conv"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.v_conv1d.weight"
slot = "layers.{layer}.attn.v_conv1d.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", 1, "kda_conv"]
split = "conv"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.f_a_proj.weight"
slot = "layers.{layer}.attn.f_a_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.f_b_proj.weight"
slot = "layers.{layer}.attn.f_b_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "kda_head_dim"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.g_a_proj.weight"
slot = "layers.{layer}.attn.g_a_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_head_dim", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.g_b_proj.weight"
slot = "layers.{layer}.attn.g_b_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_width", "kda_head_dim"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.b_proj.weight"
slot = "layers.{layer}.attn.b_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_heads", "hidden"]
split = "rows"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.A_log"
slot = "layers.{layer}.attn.A_log"
part = "kda_scan"
role = "attention"
dtype = "f32"
shape = ["kda_heads"]
split = "vector"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.dt_bias"
slot = "layers.{layer}.attn.dt_bias"
part = "kda_scan"
role = "attention"
dtype = "f32"
shape = ["kda_width"]
split = "vector"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.o_norm.weight"
slot = "layers.{layer}.attn.o_norm.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["kda_head_dim"]
split = "whole"
repeat = "layers"
when = { attention = "kda" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.o_proj.weight"
slot = "layers.{layer}.attn.o_proj.weight"
part = "kda_scan"
role = "attention"
dtype = "bf16"
shape = ["hidden", "kda_width"]
split = "columns"
repeat = "layers"
when = { attention = "kda" }

# Sparse MLA (deepseek_sparse_attention layers).
[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_a_proj.weight"
slot = "layers.{layer}.attn.wq_a.weight"
part = "mla_attention"
role = "attention"
dtype = "dense"
shape = ["q_lora", "hidden"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_a_proj.weight"
slot = "mtp.{stage}.attn.wq_a.weight"
part = "mla_attention"
role = "mtp"
dtype = "dense"
shape = ["q_lora", "hidden"]
split = "whole"
repeat = "mtp"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_a_layernorm.weight"
slot = "layers.{layer}.attn.q_norm.weight"
part = "mla_attention"
role = "attention"
dtype = "bf16"
shape = ["q_lora"]
split = "whole"
repeat = "layers"
when = { attention = "mla" }

[[tensor]]
name = "model.language_model.layers.{layer}.self_attn.q_a_layernorm.weight"
slot = "mtp.{stage}.attn.q_norm.weight"
part = "mla_attention"
role = "mtp"
dtype = "bf16"
