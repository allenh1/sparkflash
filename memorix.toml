# Memorix configuration
#
# Primary user-facing config lives in TOML. Legacy YAML/.env files are still read for compatibility.
# Generated by: memorix init --project
# Date: 2026-10-15
#
# Project config should not store credentials. Keep credentials in global config or launcher secrets.

[agent]
# Optional memcode coding-agent lane.
# Leave unset to use memcode login/model settings or the memory.llm fallback.
# provider = "deepseek"
# model = "deepseek-chat"
# base_url = "https://api.deepseek.com/v1"

[embedding]
provider = "off"

[git]
auto_hook = false
ingest_on_commit = true
max_diff_size = 500
skip_merge_commits = true
# exclude_patterns = ["*.lock", "dist/**"]

[memory]
inject = "minimal"
sync_advisory = true
auto_cleanup = true
formation = "active"

[server]
transport = "stdio"
dashboard = true
dashboard_port = 3210
