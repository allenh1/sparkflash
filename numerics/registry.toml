# DeepSeek-V4.1-Flash's TP=4 device path serves greedy text only, so its evidence is text and it
# has no anchor. Its greedy text depends on the server's history: a request resumed from the
# prefix a reused lane holds can differ from the same request prefilled whole (docs/NUMERICS.md
# §7). The reference is the suite's first pass on a freshly booted server, which reproduces; a
# check must run on a freshly booted server too.
[[config]]
model = "deepseek-ai/DeepSeek-V4.1-Flash"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "text"
reference = "references/deepseek-v41-tp4-sm121a.json"
fingerprint = "4e513949b99c263eb407459bfeedc6b513bcd0f37f2e30cc348838976ac725a1"
captured = "2026-11-03"
note = "Production's launch (debug build, NCCL reduce, prefix reuse on), 128 greedy tokens, on a freshly booted server."

