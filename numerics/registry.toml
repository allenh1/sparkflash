# DeepSeek-V4.1-Flash's TP=4 device path serves greedy text only, so its evidence is text and it
# has no anchor. Its greedy text depends on the server's history: a request resumed from the
# prefix a reused lane holds can differ from the same request prefilled whole (docs/NUMERICS.md
# §7). The reference is the suite's first pass on a freshly booted server, which reproduces; a
# check must run on a freshly booted server too.
[[config]]
model = "deepseek-ai/DeepSeek-V4.1-Flash"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "text"
reference = "references/deepseek-v41-tp4-sm121a.json"
fingerprint = "4e513949b99c263eb407459bfeedc6b513bcd0f37f2e30cc348838976ac725a1"
captured = "2026-11-03"
note = "Production's launch (debug build, NCCL reduce, prefix reuse on), 128 greedy tokens, on a freshly booted server."

# GLM-5.3-Flash serves only at world 4. Its shipped default keeps the attention window's latent
# cache in E4M3 and prefills in bulk with FP8 operands; v1-e4m3-window.md measures that trade
# against the f32-cache anchor below. Version 2 decodes one-to-eight-row FP8 projections on the
# shared tile's few-row body (glm_decode_fp8b128_rows), the first change to move this model's
# bits; v2-fp8-token-body.md declares it and records that the served delta is not measured yet.
[[config]]
model = "zai-org/GLM-5.3-Flash"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 3
evidence = "logprobs"
reference = "references/glm53-tp4-sm121a.json"
fingerprint = "827ec5f682d512ccc73f10e6145a1ada548fbc027710d09330b34da61c3bafd6"
report = "docs/numerics/glm53/v3-gemv.md"
captured = "2026-11-05"
approved = { decision = "The FP8 tile body is slower in both measured pairs; GLM returns to the row GEMV as version 3", date = "2026-11-19", report = "docs/numerics/glm53/v3-gemv.md" }
note = "Version 3 returns the one-to-eight-row FP8 projections to the tiled row GEMV, which are version 1's bits; the reference is version 1's own card and the v2 report's separation capture showed SPARKFLASH_DECODE_MMA=off reproduces it exactly. The speed rule decided it: one build (18a76075) alternating the switch across four fresh boots gave ON 42.06/56.22 and 41.78/47.93 tok/s against OFF 46.20/61.50 and 46.35/61.42 (single/four-lane); the body is 8.6-9.9% worse single and 8.6% worse at four lanes in the clean pair (-22% in the loaded one), against a +2% four-lane bar and a -3% single guard. The code default for decode.tensor_cores is now off and the serving check refuses =true; the body stays in the catalogue and in the committed monitor pair (glm53-tp4-v2-candidate.json), which still passes at its bars."

# Inkling-2-Small and Dory1.0-4B were registered before their first capture: both entries named
# the configuration, version and evidence and left `reference` and `fingerprint` out. That is the
# registry's uncaptured state (docs/NUMERICS.md §5): the binary reports them unregistered and
# `scripts/numerics.py check` says no reference has been captured, rather than comparing against
# one. Phase 5 of docs/engine/04-onboarding.md takes their first reference after tensor-core
# decode, so each entry was registered at the arithmetic it will be measured on. Both were taken
# on 2026-11-19; the registry has no uncaptured configuration left.
[[config]]
model = "thinkingmachines/Inkling-2-Small"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 2
evidence = "logprobs"
reference = "references/inkling2-tp4-sm121a-v2.json"
fingerprint = "acd86d46e35be58a11556252278219e3f3171de278f9af74588ae61c9c277652"
captured = "2026-11-19"
report = "docs/numerics/inkling2/v2-clean-head.md"
approved = { decision = "The head layout defect fix (6dd347c9, 158f5723) restores Inkling's clean arithmetic; version 1 pinned token soup", date = "2026-11-19", report = "docs/numerics/inkling2/v2-clean-head.md" }
note = "Version 2 is the fixed build b62e2fcb (binary 23666b8d), captured after 6dd347c9 and 158f5723 put the head back on the row GEMV: two free captures are bit-identical and the card names its commit. The correctness floor (docs/NUMERICS.md section 5) records the forced comparison against 7850cffc, the pre-change row-GEMV build: 970 positions, top-1 agreement 100.00%, mean |delta NLL| 1.691e-04, max 7.307e-02 nat, 0 of the worst 20 positions at position 0 and the worst 20 spread over 7 of the 8 prompts, so the remaining expert few-row and MXFP8 change is a precision tail, not a defect. Known answers: 'The capital of France is' decodes ' Paris...' and 'Hello, who are you?' decodes a coherent English opener; '2+2=' decodes '5', identically on the pre-change build, recorded in the floor as the model's own answer rather than a regression. The reference's own mean NLL is 0.1806 a token. The anchor is replaced because the version-1 anchor pinned the soup. The head remains the row GEMV (tensor-core head restoration is docs/numerics/inkling2/v2-clean-head.md's open item); the model's coverage and monitors rows are still missing, so this bump carries the owner's approval."

# Dory1.0-4B's world-4 registration could not be served from the released checkpoint: it carries
# two recurrent loops, and `DoryStage::of_rank` refuses a world that does not divide them, so the
# ring's legal widths are 1 and 2. The entry was retired rather than served with a rewritten
# `n_recurrent_loops`, which would have changed the model rather than measured it. The reference is
# the world-1 configuration, which is also the numerics key the ring reports (recurrence.rs serves
# rank 0 through `serve_backend`, world 1).
[[config]]
model = "nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16"
world = 1
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 2
evidence = "logprobs"
reference = "references/dory10-tp1-sm121a-v2.json"
fingerprint = "4f3af7e00edbf29f5d649a519fe258dd77e412725fb292acd4addbfee3955abc"
captured = "2026-11-19"
report = "docs/numerics/dory10/v2-gemv.md"
approved = { decision = "The few-row body is 33% slower at one lane; Dory returns to the row GEMV as version 2", date = "2026-11-19", report = "docs/numerics/dory10/v2-gemv.md" }
note = "Version 2 returns Dory's one-to-eight-row projections to the row GEMV, on the pre-change build 84f07db7 (binary 4de25a5e still). The speed rule decided it: body 17.77 and 17.55 tok/s against GEMV 26.19 and 26.15 at world 1, one process, context 8192 (ratios 0.679 and 0.671), and one-process Dory accepts one lane only, so the 16-lane half of the rule degenerates to the single number. The floor's forced comparison against version 1's reference over 1024 positions is a precision tail: mean delta -3.062e-05, mean absolute 4.962e-04, max 1.006e-02, top-1 100%; the capital known answer is Paris, and the two empty probes are a 128-token reasoning-budget artifact recorded in the report. The reference's own mean NLL is 0.1616 a token. The world-2 ring capture stays bit-identical to version 1's reference (numerics/captures/dory10/world2-ring.json), so the ring still needs no entry of its own."

