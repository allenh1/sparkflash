# The numerics registry: the declared arithmetic of every served configuration (docs/NUMERICS.md,
# DECISIONS.md D67).
#
# Nothing changes unless someone declared it. Each [[config]] names one configuration - model,
# world size, numerics profile, parallel plan and CUDA architecture - and the numerics version it
# serves, with the fingerprint of the reference that version produced. `scripts/numerics.py check`
# captures a running server and fails when its bits differ from the fingerprint here;
# `scripts/numerics.py ci` fails a commit whose reference or fingerprint changed without a version
# bump, or whose version bumped without a change. The binary embeds this file and reports the
# entry it serves at boot and on /v1/models.
#
# A bump waits for the prerequisites below: the global declaration check and the bumping model's
# own anchor, coverage and monitor rows. The owner may instead record an approval beside the entry,
# which replaces the model's coverage and monitors prerequisites for that one bump:
#
#     approved = { decision = "<one line>", date = "YYYY-MM-DD", report = "docs/numerics/..." }
#
# The report must exist and be new or changed in the bump's own diff, and the decision must be
# non-empty. The declared change, the entry's own report and the model's anchor still apply, so a
# model with no anchor cannot bump under an approval. An approval is part of the record, like a
# version: ci refuses its removal, an empty decision or date, and a bump that changes nothing.
#
# [[anchor]] entries are the frozen quality references a declared change is measured against
# (docs/NUMERICS.md §4). They are never edited or removed. There is one per model: a bump is
# looked up against the bumping configuration's own anchor, not a global flag.

schema = 1

# The prerequisites docs/NUMERICS.md §5 names. `anchor`, `coverage` and `monitors` are per model,
# and each flag below is the aggregate report over every model whose captured evidence is logprobs:
# it is true only when every such model has its own row and that row passes. The flags are reports,
# not gates: `scripts/numerics.py ci` looks up the bumping entry's own model and names it when the
# model's row is missing, malformed or below its bar. Only `declaration_check` gates every bump.
# Turning an aggregate flag on is a reviewed edit that adds the rows it rests on in the same change.
[prerequisites]
# Per model. Qwen3.8, GLM-5.3, Inkling-2 and Dory1.0 each have an anchor and a committed
# teacher-forced capture; DeepSeek is exempt because its device path serves no logprobs, so a text
# reference cannot teacher-force and a text-evidence bump is refused. The aggregate is true because
# every captured logprobs model is anchored; a model without its own anchor still cannot bump.
anchor = true
# The CI declaration check (`scripts/numerics.py ci`, run by the scripts-tests job).
declaration_check = true
# The coverage bar: the fraction of (layer, routed-expert) slots a committed coverage dump must
# reach. It is a fraction of the layout's routed slots, not a count, and it is deliberately below
# 1.0: real serving reached 92-93% of Qwen3.8's 48x512 slots after 240-330 inputs and every layer
# still carried gaps, so "every routed expert of every layer" was an unstated bar that a real run
# cannot meet. 0.93 is the owner's agreed bar (this session's decision, docs/NUMERICS.md §5); a
# bar of 1.0 would still mean every slot. It must be in (0, 1]; `scripts/numerics.py coverage`
# prints the achieved fraction and the per-layer missing experts and fails below this value.
coverage_slots = 0.93
# Per model. The aggregate is false because the registry holds one [[coverage]] row (Qwen3.8 world
# 1) and three captured logprobs models (GLM-5.3, Inkling-2, Dory1.0) without one; a model with no
# row has coverage missing, so an unapproved bump on it is refused with the model named.
coverage = false
# Per model. The aggregate is false because the registry holds one [[monitors]] row (GLM-5.3's
# pair) and three captured logprobs models (Qwen3.8, Inkling-2, Dory1.0) without one; a model with
# no pair row has monitors missing. No model has both rows yet, so every unapproved bump is refused
# today; an approved bump needs neither (docs/NUMERICS.md §5).
monitors = false

# The per-model coverage evidence: one row a model, the dump committed under numerics/coverage/ and
# the suite's declared input floor. The bar is the shared `coverage_slots` above. Qwen3.8 world 1's
# swept dump reaches 24,494 of 24,576 routed slots (99.67%) over 416 inputs; `ci` judges it and
# refuses a true aggregate flag whose captured logprobs models lack a passing row.
[[coverage]]
model = "nvidia/Qwen3.8-Flash-Next-NVFP4"
dump = "numerics/coverage/qwen38-world1.json"
min_inputs = 8

# The per-model monitor evidence: one row a model, the committed reference/candidate pair and the
# relative-error bars it is judged at. The pair below is GLM-5.3 at world 4: the reference build
# (SPARKFLASH_DECODE_MMA=off, the tiled row GEMV) against the shipped default (the FP8 few-row
# body). It passes at its bars (maxima 3.158e-01 per layer, 3.511e-01 per shared expert, 7 of 42
# layers routing one row to a different expert and 14 experts unshared of 343); the bars are a
# regression guard sitting just above those maxima, not a quality claim.
[[monitors]]
model = "zai-org/GLM-5.3-Flash"
reference = "numerics/monitors/glm53-tp4-v1-reference.json"
candidate = "numerics/monitors/glm53-tp4-v2-candidate.json"
layer_bar = 0.5
expert_bar = 0.5

# Qwen3.8-Flash-Next: the host driver at world 1, the TP driver at 2 and 4. Each world sums in its
# own order, so each has its own reference. Version 1 decodes on the tensor cores, in the
# arithmetic its prefill already used (D68), so a continued chat turn is the bits of a cold one;
# v1-tc-decode.md measures that against the anchor, which keeps the token-kernel decode
# (SPARKFLASH_DECODE_MMA=off), and v1-tp-floor.md the reassociation floor docs/NUMERICS.md §4
# names.
[[config]]
model = "nvidia/Qwen3.8-Flash-Next-NVFP4"
world = 1
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "logprobs"
reference = "references/qwen38-tp1-sm121a.json"
fingerprint = "37578a09102537e51b3ff5ba0d5bef2becbf1c7578459e5fbe9c5e53c872901b"
report = "docs/numerics/qwen38/v1-tc-decode.md"
captured = "2026-11-03"
note = "NVFP4 weights; tensor-core prefill and decode (each activation a BF16 head and remainder, FP32 sums); BF16 KV cache; context 65,536."

[[config]]
model = "nvidia/Qwen3.8-Flash-Next-NVFP4"
world = 2
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "logprobs"
reference = "references/qwen38-tp2-sm121a.json"
fingerprint = "d1d546aed4e8f285494cddcdcd1b9b788a60af3494ee260ba68deda5f936b425"
report = "docs/numerics/qwen38/v1-tc-decode.md"
captured = "2026-11-03"
note = "The TP driver on two nodes over NCCL, context 65,536."

[[config]]
