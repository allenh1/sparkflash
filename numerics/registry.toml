# The numerics registry: the declared arithmetic of every served configuration (docs/NUMERICS.md,
# DECISIONS.md D67).
#
# Nothing changes unless someone declared it. Each [[config]] names one configuration - model,
# world size, numerics profile, parallel plan and CUDA architecture - and the numerics version it
# serves, with the fingerprint of the reference that version produced. `scripts/numerics.py check`
# captures a running server and fails when its bits differ from the fingerprint here;
# `scripts/numerics.py ci` fails a commit whose reference or fingerprint changed without a version
# bump, or whose version bumped without a change. The binary embeds this file and reports the
# entry it serves at boot and on /v1/models.
#
# [[anchor]] entries are the frozen quality references a declared change is measured against
# (docs/NUMERICS.md §4). They are never edited or removed.

schema = 1

# The four prerequisites docs/NUMERICS.md §5 names. Until every one is true, no configuration may
# bump its version, which is to say no arithmetic change may land; `scripts/numerics.py ci`
# enforces that. Turning one on is a reviewed edit with the tool or data it names in the same diff.
[prerequisites]
# The frozen anchors below, plus the teacher-forced comparison (`scripts/numerics.py compare`).
anchor = false
# The CI declaration check (`scripts/numerics.py ci`, run by the scripts-tests job).
declaration_check = true
# Inputs that reach every routed expert of every layer, with the per-layer hit counts to prove it.
coverage = false
# Per-layer and per-expert relative error against the reference forward.
monitors = false

# Qwen3.8-Flash-Next: the host driver at world 1, the TP driver at 2 and 4. Each world sums in its
# own order, so each has its own reference. Version 1 decodes on the tensor cores, in the
# arithmetic its prefill already used (D68), so a continued chat turn is the bits of a cold one;
# v1-tc-decode.md measures that against the anchor, which keeps the token-kernel decode
# (SPARKFLASH_DECODE_MMA=off), and v1-tp-floor.md the reassociation floor docs/NUMERICS.md §4
# names.
[[config]]
model = "nvidia/Qwen3.8-Flash-Next-NVFP4"
world = 1
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "logprobs"
reference = "references/qwen38-tp1-sm121a.json"
fingerprint = "37578a09102537e51b3ff5ba0d5bef2becbf1c7578459e5fbe9c5e53c872901b"
report = "docs/numerics/qwen38/v1-tc-decode.md"
captured = "2026-11-03"
note = "NVFP4 weights; tensor-core prefill and decode (each activation a BF16 head and remainder, FP32 sums); BF16 KV cache; context 65,536."

