# DeepSeek-V4.1-Flash's TP=4 device path serves greedy text only, so its evidence is text and it
# has no anchor. Its greedy text depends on the server's history: a request resumed from the
# prefix a reused lane holds can differ from the same request prefilled whole (docs/NUMERICS.md
# §7). The reference is the suite's first pass on a freshly booted server, which reproduces; a
# check must run on a freshly booted server too.
[[config]]
model = "deepseek-ai/DeepSeek-V4.1-Flash"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "text"
reference = "references/deepseek-v41-tp4-sm121a.json"
fingerprint = "4e513949b99c263eb407459bfeedc6b513bcd0f37f2e30cc348838976ac725a1"
captured = "2026-11-03"
note = "Production's launch (debug build, NCCL reduce, prefix reuse on), 128 greedy tokens, on a freshly booted server."

# GLM-5.3-Flash serves only at world 4. Its shipped default keeps the attention window's latent
# cache in E4M3 and prefills in bulk with FP8 operands; v1-e4m3-window.md measures that trade
# against the f32-cache anchor below. Version 2 decodes one-to-eight-row FP8 projections on the
# shared tile's few-row body (glm_decode_fp8b128_rows), the first change to move this model's
# bits; v2-fp8-token-body.md declares it and records that the served delta is not measured yet.
[[config]]
model = "zai-org/GLM-5.3-Flash"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 2
evidence = "logprobs"
reference = "references/glm53-tp4-sm121a-v2.json"
fingerprint = "451be41bb5fbe34db4646d2167647fad282be34b2f144523fe4549d101be30fa"
report = "docs/numerics/glm53/v2-fp8-token-body.md"
captured = "2026-11-19"
approved = { decision = "tensor-core decode on every arm is an approved arithmetic change", date = "2026-11-18", report = "docs/numerics/glm53/v2-fp8-token-body.md" }
note = "Version 2: the one-to-eight-row FP8 projections run the shared tile's few-row body (glm_decode_fp8b128_rows) instead of the tiled row GEMV (q4e_gemv_tiled_e4m3_block). The separation capture settles attribution: the same build with SPARKFLASH_DECODE_MMA=off, which runs the GEMV, reproduces version 1's reference exactly (0 of 997 positions differ, top-1 100%), so the whole +1.373e-01 mean NLL and 93.38% top-1 agreement is the body's. Decode takes f32 activations where the bulk prefill takes the q8 path, so a continued turn is not a cold one; known and accepted, not a defect. The tail is recorded in the report: 11 positions above 5 nats, worst 1.446e+01 at translation position 80, spread across six of the eight prompts with no shape or position pattern. Approved by the owner on 2026-11-18 (decision above); the coverage and monitor prerequisites are not yet on."

# Inkling-2-Small and Dory1.0-4B were registered before their first capture: both entries named
# the configuration, version and evidence and left `reference` and `fingerprint` out. That is the
# registry's uncaptured state (docs/NUMERICS.md §5): the binary reports them unregistered and
# `scripts/numerics.py check` says no reference has been captured, rather than comparing against
# one. Phase 5 of docs/engine/04-onboarding.md takes their first reference after tensor-core
# decode, so each entry was registered at the arithmetic it will be measured on. Both were taken
# on 2026-11-19; the registry has no uncaptured configuration left.
[[config]]
model = "thinkingmachines/Inkling-2-Small"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "logprobs"
reference = "references/inkling2-tp4-sm121a.json"
fingerprint = "387647bcc3268572b2c4023978692fad7b150bcf63a0cfc12c7d5dfaaab23f16"
captured = "2026-11-19"
report = "docs/numerics/inkling2/v1-few-row-decode.md"
note = "The four-rank group's first reference, captured on the branch at 5a092d5a with the arm launched by scripts/inkling-serve-group.sh: two runs bit-identical and the served gate's lanes check PASS. It pins the arithmetic the decode change lands (head and one-to-eight-row experts on the prompt tiles' bodies: q4p_dense_rows; q4p_moe_rows_gate_up_capped/_down, and the MXFP8 tile), so version 1 is the change itself and not a bump. Its speed and its distance from the row-GEMV decode are unmeasured (docs/numerics/inkling2/v1-few-row-decode.md)."

# Dory1.0-4B's world-4 registration could not be served from the released checkpoint: it carries
# two recurrent loops, and `DoryStage::of_rank` refuses a world that does not divide them, so the
# ring's legal widths are 1 and 2. The entry was retired rather than served with a rewritten
# `n_recurrent_loops`, which would have changed the model rather than measured it. The reference is
# the world-1 configuration, which is also the numerics key the ring reports (recurrence.rs serves
# rank 0 through `serve_backend`, world 1).
[[config]]
model = "nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16"
world = 1
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
evidence = "logprobs"
reference = "references/dory10-tp1-sm121a.json"
fingerprint = "99715d0072eab1e1cef89dbfe990faa2de2b053320c61b25726855aa460e22e3"
captured = "2026-11-19"
report = "docs/numerics/dory10/v1-few-row-decode.md"
note = "The released checkpoint's first reference, single process at world 1: two captures bit-identical and `check` passing on two boots. It pins the arithmetic the decode change lands (projections on the wide tile's few-row body, q4p_dense_rows), so version 1 is the change itself and not a bump. The world-2 recurrence ring was captured on 2026-11-19 and is bit-identical to this reference (8/8 prompts, 1024/1024 logprobs, top-1 100%; numerics/captures/dory10/world2-ring.json), so the ring needs no entry of its own. Its speed, its distance from the row-GEMV decode and the ring's speed against a single process are unmeasured (docs/numerics/dory10/v1-few-row-decode.md). The world-2 ring capture was taken on the binary ef3d022e, whose own card names no commit; its commit a6ef32e4 is inferred from the staged source tree, whose Cargo.toml, crates/sparkflash-model-glm5-next/src/lib.rs and crates/sparkflash-cli/src/serve.rs match it byte for byte."

[[retired]]
model = "nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16"
world = 4
profile = "reference"
plan = "tp"
arch = "sm_121a"
version = 1
reason = "Registered before the arm was wired; the release carries two recurrent loops, so a group of four cannot split them (DoryStage::of_rank). Replaced by the world-1 entry."

