# SparkFlash-RS CI: weight-free correctness gate.
#
# Everything in this pipeline runs on any x86_64 or aarch64 host: no checkpoint, no RDMA
# fabric, and no GPU. Hardware-specific crates are exercised through their CPU reference
# implementations and mock transports. CUDA is the one exception, and it still needs no GPU:
# the cuda-abi job compiles device-only code with nvcc, which is enough to type-check every
# static assert in the shared trace ABI header.
stages:
  - check
  - test

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

default:
  image: rust:1.98
  # The shared docker runner intermittently refuses jobs at pickup with
  # runner_system_failure and an empty trace (the job never runs a command).
  # Retrying those on the same commit is the honest fix; it does not mask a
  # real failure, because script failures are never retried.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - target/
    - .cargo-home/

fmt:
  stage: check
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

# Every public item in the workspace must carry a doc comment. Review round 5 found that
# nothing had ever run this, which is how sparkflash-trace, sparkflash-kv, sparkflash-comm
# and sparkflash-cli all drifted out of compliance.
rustdoc:
  stage: check
  script:
    - RUSTDOCFLAGS="-D missing_docs" cargo doc --workspace --no-deps

# D26 freezes the Milestone-4 ABI lint (crates/sparkflash-kernels/src/m4_abi.rs and the pinned
# submodules under src/m4_abi/: the quarantine split moved the scanners there verbatim, and the pin
# is the aggregate over the family): it parses kernel source text, and its own contract says that
# scan is explicitly not the proof - the committed cubin baseline is - while the recorded review
# history reaches round 36 with a real false accept or false rejection in every round. New kernel
# invariants go to compiled-artifact inspection (the cuda-abi job's baseline) or runtime device
# assertions instead. This cheap, always-on check fails if the family's total line count differs
# from its pin, so a new scanner cannot arrive as a side effect of another edit and an existing one
# cannot disappear without the pin diff.
# A commit that changes the family's length (or its pinned file set) changes PINNED_LINES in
# ci/check-m4-abi-size.sh in the same diff; that diff is the deliberate act a reviewer reads, and
# ci/verify-m4-abi-split.py proves the split itself is a verbatim move of 0639413's m4_abi.rs.
m4-abi-freeze:
  stage: check
  script:
    - sh ci/check-m4-abi-size.sh

test:
  stage: test
  script:
    # No --all-features here on purpose: the only optional feature in the workspace is
    # sparkflash-kernels/cuda, and enabling it pulls in cudarc, whose build script refuses to
    # configure a CUDA version without a toolkit and a target. CUDA is exercised by cuda-abi
    # below, which runs in an image that really has a toolkit.
    - cargo test --workspace
    - cargo test -p sparkflash-trace --no-default-features

# `cargo test --workspace` does not run the tests inside example harnesses: it builds the examples
# to check they compile, but their #[cfg(test)] blocks are invisible to every gate. The m8_sequence
# harness keeps its rotation accounting, dispatch plan, fixture pin and comparison-plumbing invariants
# there, so those checks had never run in CI. This job runs them explicitly; it needs no GPU, no
# checkpoint and no cubin.
test-examples:
  stage: test
  script:
    - cargo test -p sparkflash-kernels --examples

# `cargo test --workspace` builds only the default feature sets, so code behind a non-default
# feature is compiled by no job unless a job names it. sparkflash-engram's io_uring ring sits
# behind `io-uring`, which no crate in the workspace enables: the ring and its tests were
# invisible to six rounds of green gates, which is how an orphaned-submission-queue defect
# survived all of them, and sparkflash-comm/rdma was in the same position. This job discovers
# the features rather than listing them, tests and lints each one, fails on an empty feature that
# nothing names, and fails when a feature appears that is not classified as hardware-only in
# ci/check_features.py - so a feature cannot go uncompiled again without somebody writing down why.
# The script's own tests run first, because the first version of it silently skipped the very
# feature it was written for.
#
# One gap this job cannot close, written down rather than implied: the runner's seccomp policy
# refuses io_uring_setup with EPERM, so the ring-dependent tests in sparkflash-engram report that
# they did NOT verify the ring (one line each, on stderr, naming the test and the errno) and pass.
# Compiling the feature, linting it and running its non-ring logic is real coverage and is what this
# job adds; the ring's own syscall behaviour is verified on a host that permits io_uring_setup, by
# the same tests with SPARKFLASH_REQUIRE_IO_URING=1 set, which turns a skip into a failure. Read a
# green io-uring job as "the feature builds and its logic passes", never as "the ring ran here".
test-features:
  stage: test
  script:
    - rustup component add clippy
    - apt-get update
    - apt-get install -y --no-install-recommends python3
    - python3 ci/test_check_features.py
    - python3 ci/check_features.py

# Actually compiles CUDA. This replaces a job that ran `command -v nvcc || exit 0` in a
# rust:1.98 image and therefore never compiled a single line of CUDA in its life.
#
# It is a hard gate on purpose: no allow_failure, no `|| exit 0`, and no SPARKFLASH_CUDA_ARCH
# override. build.rs defaults to the DGX Spark target sm_121a, so a toolkit that does not know
# that architecture fails here instead of quietly compiling something else.
cuda-abi:
  stage: test
  tags: [cuda]
  image: nvidia/cuda:13.0.3-devel-ubuntu22.04
  variables:
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target-cuda"
    # Named explicitly so a missing toolkit is a loud failure rather than the silent skip that
    # made the previous job useless.
    SPARKFLASH_NVCC: /usr/local/cuda/bin/nvcc
  cache:
    - key: "cargo-$CI_COMMIT_REF_SLUG"
      paths:
        - .cargo-home/
    - key: "cuda-$CI_COMMIT_REF_SLUG"
      paths:
        - target-cuda/
        - .rustup/
  script:
    - test -x "$SPARKFLASH_NVCC"
    - $SPARKFLASH_NVCC --version
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl diffutils gcc g++ make
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --component rustfmt --component clippy
    - . "$CARGO_HOME/env"
    - rustc --version
    # build.rs writes its PTX into OUT_DIR, which is not part of cargo's fingerprint, so a
    # target dir restored from cache could satisfy the assertion below without compiling
    # anything. Clearing just this crate forces the build script to run again.
    - cargo clean -p sparkflash-kernels
    - cargo test -p sparkflash-kernels
    # Proof that nvcc really compiled the probe for sm_121a: build.rs only writes this file
    # when the toolkit accepted the header, and it is silent (a cargo warning) when nvcc is
    # missing or refuses the architecture.
    - test -n "$(find "$CARGO_TARGET_DIR" -name trace_abi_probe.ptx -print -quit)"
    - find "$CARGO_TARGET_DIR" -name trace_abi_probe.ptx -exec ls -l {} +
    # The job this replaced also claimed to test --features cuda and never did. The feature is
    # enabled exactly as a user would enable it - nothing appended to satisfy cudarc - because the
    # root manifest now selects cudarc's cuda-version-from-build-system feature, and that is the
    # shape a reader has to be able to reproduce. A version feature added only on this command line
    # would leave a plain --features cuda broken for everyone else.
    - cargo test -p sparkflash-kernels --features cuda
    # The feature sweep in ci/check_features.py lints every non-default feature, but it cannot lint
    # --features cuda without a toolkit: cudarc's build script probes nvcc and exits if it is absent.
    # This job HAS the toolkit, so the cuda lint belongs here - a workspace clippy resolves default
    # features only and would leave the CUDA paths unlinted. The sweep prints a loud line naming this
    # job when it skips the command, so the two together close the gap rather than each assuming the
    # other.
    - cargo clippy -p sparkflash-kernels --all-targets --features cuda -- -D warnings
    # The committed kernel baseline is the check that would catch a kernel silently changing. It
    # recompiles all nine baseline kernels (the six Milestone 4 kernels, the M7 SwiGLU
    # quantiser epilogue, the task-37 device router and the task-8 routed gate/up GEMM) with this
    # job's nvcc, compares the cubin bytes, the
    # cubin sha256 and the PTX membar line count against
    # crates/sparkflash-kernels/baseline/kernel_baseline.txt, and reports a different toolkit as a
    # toolkit change (with the regenerate command) rather than as a kernel change - a compiler
    # upgrade that looked like a regression would make the check useless. tests/kernel_baseline.rs
    # runs the same script and skips when nvcc is absent - a skip libtest reports only under
    # --nocapture and build.rs reports as its own cargo:warning - so this step is what enforces it.
    - /bin/sh crates/sparkflash-kernels/scripts/check-kernel-baseline.sh
    # The codec golden table is the ground truth the MXFP8/MXFP4 tests compare against, and it is
    # committed from outside the tree. Until this step existed, nothing could tell a table nvcc
    # had just produced from one somebody had edited: the provenance was a claim. The script
    # regenerates it here and fails unless the bytes match, which is also the only thing keeping
    # the claimed toolkit version honest.
    - sh crates/sparkflash-kernels/scripts/regen-codec-fixture.sh

# The per-commit gate above is deliberately not duplicated here. gate-artifact is the record
# producer: it runs the same host gate set through ci/host-gates.py and keeps one machine-readable
# JSON plus one log per gate. The JSON records the exact argv, cwd, exit codes, suite counts,
# toolchain strings and git sha, so a batch record is a diffable artifact instead of prose and a
# future release gate can compare two runs directly (python3 ci/host-gates.py --diff OLD NEW).
# Manual on purpose: the check/test jobs already gate every commit; this job records a run when a
# batch needs the evidence. No network, no GPU, no checkpoint.
gate-artifact:
  stage: test
  when: manual
  # Optional by intent: a manual job that is not required for the gate. Setting this explicitly
  # keeps the pipeline verdict 'success' when nobody starts it, instead of relying on the default.
  allow_failure: true
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3
    - rustup component add rustfmt clippy
    - python3 ci/host-gates.py --out gate-artifacts
  artifacts:
    when: always
    paths:
      - gate-artifacts/
    expire_in: 90 days
